  return node;
}

function tag(text) {
  return el('span', 'tag', text);
}

function inline(...parts) {
  const node = el('span', 'inline');
  parts.filter(Boolean).forEach(p => node.append(typeof p === 'string' ? document.createTextNode(p) : p));
  return node;
}

function method(name) {
  return el('span', 'method m-' + name.toLowerCase(), name);
}

function route(path) {
  const node = el('span', 'code');
  path.split('/').forEach((part, i) => {
    if (i > 0) node.append(document.createElement('wbr'), document.createTextNode('/'));
    node.append(document.createTextNode(part));
  });
  return node;
}

function serviceLink(name) {
  if (name === EXTERNAL || name.startsWith('external:')) return el('span', 'link external', title(name));
  const node = el('button', 'link', title(name));
  node.type = 'button';
  node.addEventListener('click', () => go('service/' + name));
  return node;
}

function eventName(name, kind) {
  return inline(icon(kind || 'event', kind === 'domain' ? 'D' : 'E'), el('span', 'code', name));
}

function push(map, key, value) {
  if (!map.has(key)) map.set(key, []);
  map.get(key).push(value);
}

function buildIndex() {
  const publishers = new Map();
  const consumers = new Map();
  const externals = new Map();
  services.forEach(s => s.aggregates.forEach(a => {
    a.publishes.forEach(p => push(publishers, p.contract, s.service));
    a.consumes.forEach(c => push(consumers, c.contract, s.service));
  }));
  services.forEach(s => (s.externals || []).forEach(x => {
    const id = 'external:' + x.name;
    externals.set(id, x);
    x.publishes.forEach(c => push(publishers, c, id));
    x.consumes.forEach(c => push(consumers, c, id));
  }));
  const contracts = [...new Set([...publishers.keys(), ...consumers.keys()])].sort();
  const sourcesOf = c => { const l = [...new Set(publishers.get(c) || [])]; return l.length ? l : [EXTERNAL]; };
  const targetsOf = c => { const l = [...new Set(consumers.get(c) || [])]; return l.length ? l : [EXTERNAL]; };
  return { contracts, sourcesOf, targetsOf, externals };
}

function count(list, pick) {
  return list.reduce((n, a) => n + (pick(a) || []).length, 0);
}

function stats(entries) {
  const bar = document.getElementById('stats');
  bar.replaceChildren();
  entries.filter(([, value]) => value > 0).forEach(([label, value]) => {
    const widget = el('span');
    widget.append(el('b', null, String(value)), document.createTextNode(plural(value, label)));
    bar.append(widget);
  });
}

function sidebar(current) {
  const nav = document.getElementById('sidebar');
  nav.replaceChildren();
  const entry = (kind, label, target, extra) => {
    const button = el('button', 'side-item');
    button.type = 'button';
    button.append(glyph(kind), el('span', null, label));
    if (extra !== undefined) button.append(el('span', 'count', String(extra)));
    if (target === current || current.startsWith(target + '/')) button.setAttribute('aria-current', 'page');
    button.addEventListener('click', () => go(target));
    nav.append(button);
  };
  const parent = (kind, label, open, target, extra) => {
    const button = el('button', 'side-item side-parent' + (open ? ' open' : ''));
    button.type = 'button';
    button.append(el('span', 'chevron'), glyph(kind), el('span', null, label));
    if (extra !== undefined) button.append(el('span', 'count', String(extra)));
    button.addEventListener('click', () => go(target));
    nav.append(button);
  };
  if (services.length > 1) {
    parent('system', 'System', current.startsWith('system/'), 'system/calls');
    SYSTEM_VIEWS.forEach(v => {
      entry(v.id, v.label, 'system/' + v.id);
      nav.lastChild.classList.add('side-child');
    });
  }
  const sorted = [...services].sort((a, b) => a.service.localeCompare(b.service));
  parent('review', 'Review', false, 'review', FINDINGS.length);
  nav.lastChild.classList.add('side-leaf');
  if (current === 'review' || current.startsWith('review/')) nav.lastChild.setAttribute('aria-current', 'page');
  parent('service', 'Services', true, 'service/' + sorted[0].service, sorted.length);
  sorted.forEach(s => {
    const button = el('button', 'side-item side-child side-service');
    button.type = 'button';
    const dot = el('span', 'service-dot');
    dot.style.background = serviceColor(s.service);
    button.append(dot, el('span', 'side-name', title(s.service)), ...stackBadges(s.service), el('span', 'count', String(count(s.aggregates, a => a.endpoints))));
    button.title = amount(s.aggregates.length, 'Aggregate') + ', ' + amount(count(s.aggregates, a => a.endpoints), 'Endpoint');
    const here = current === 'service/' + s.service || current.startsWith('service/' + s.service + '/');
    if (here && !current.includes('/map/')) button.setAttribute('aria-current', 'page');
    button.addEventListener('click', () => go('service/' + s.service));
    nav.append(button);
    if (!here) return;
    s.aggregates.forEach(agg => {
      const item = el('button', 'side-item side-grandchild');
      item.type = 'button';
      item.append(icon('aggregate', 'A'), el('span', null, agg.name));
      if (current === 'service/' + s.service + '/map/' + agg.name) item.setAttribute('aria-current', 'page');
      item.addEventListener('click', () => go('service/' + s.service + '/map/' + agg.name));
      nav.append(item);
    });
  });
}

function go(target) {
  if (location.hash !== '#/' + target) location.hash = '#/' + target;
}

function current() {
  const hash = location.hash.replace(/^#\//, '');
  if (hash.startsWith('service/') && services.some(s => hash === 'service/' + s.service || hash.startsWith('service/' + s.service + '/'))) return hash;
  if (services.length > 1 && SYSTEM_VIEWS.some(v => hash === 'system/' + v.id || hash.startsWith('system/' + v.id + '/'))) return hash;
  if (hash === 'review' || hash.startsWith('review/')) return hash;
  return services.length > 1 ? 'system/calls' : 'service/' + services[0].service;
}

function show() {
  const target = current();
  sidebar(target);
  redraw = () => {};
  refocus = () => {};
  keys = () => {};
  boardFilter = null;
  const view = document.getElementById('view');
  document.body.append(document.getElementById('search'));
  view.replaceChildren();
  view.scrollTop = 0;
  const systemView = SYSTEM_VIEWS.find(v => target === 'system/' + v.id || target.startsWith('system/' + v.id + '/'));
  const param = systemView && target.split('/').length > 2 ? decodeURIComponent(target.split('/').slice(2).join('/')) : undefined;
  view.classList.toggle('canvas-mode', true);
  document.getElementById('search').value = '';
  const content = el('div', 'content');
  view.append(content);
  if (target === 'review' || target.startsWith('review/')) {
    const filter = target.includes('/') ? decodeURIComponent(target.slice(7)) : null;
    document.title = 'Blueprint, Review';
    document.getElementById('crumb').textContent = 'Review' + (filter ? ' › ' + (filter.startsWith('service:') ? title(filter.slice(8)) : title(filter.split(':')[1]) + ' › ' + filter.split(':')[2]) : '');
    reviewPage(content, filter);
  } else if (systemView) {
    document.title = 'Blueprint, ' + systemView.label;
    document.getElementById('crumb').textContent = 'System › ' + systemView.label;
    ({ flow: systemFlow, calls: systemCalls, contracts: systemContracts, moments: systemMoments, dependencies: systemDependencies })[systemView.id](content, param);
  } else {
    const [, name, tab, ...rest] = target.split('/');
    const service = services.find(s => s.service === name);
    const page = SERVICE_TABS.find(t => t.id === tab) || SERVICE_TABS[0];
    document.title = 'Blueprint, ' + title(service.service);
    document.getElementById('crumb').textContent = 'Services › ' + title(service.service) + ' › ' + page.label;
    serviceView(content, service, page.id, rest.length ? decodeURIComponent(rest.join('/')) : undefined);
  }
  const search = document.getElementById('search');
  const canvas = content.querySelector('.canvas');
  if (content.classList.contains('split')) resizer(content, 'picker-w', 'left', 200, 480);
  const viewHead = content.querySelector('.view-head');
  const sheetBar = content.querySelector('.sheet-bar');
  if (sheetBar) sheetBar.append(search); else if (canvas) canvas.append(search); else if (viewHead) viewHead.append(search); else content.prepend(search);
  redraw();
}

function head(view, kind, text, tags) {
  const node = el('div', 'view-head');
  node.append(glyph(kind), el('h1', null, text));
  (tags || []).forEach(t => node.append(t));
  view.append(node);
}

function canvasBadge(kind, label, tabs) {
  const badge = el('div', 'canvas-title' + (tabs ? ' with-tabs' : ''));
  badge.append(glyph(kind), el('span', null, label));
  if (tabs) {
    const bar = el('div', 'canvas-tabs');
    tabs.forEach(t => {
      const button = el('button', 'canvas-tab', t.label);
      button.type = 'button';
      if (t.active) button.setAttribute('aria-current', 'page');
      button.addEventListener('click', () => go(t.href));
      bar.append(button);
    });
    badge.append(bar);
  }
  return badge;
}

function canvasOn(view, kind, label, WORLD, inset = 0, tabs = null) {
  const canvas = el('section', 'canvas');
  const flow = el('div', 'flow world');
  const layer = svg('svg', { 'aria-hidden': 'true' });
  flow.append(layer);
  canvas.append(flow);
  canvas.append(canvasBadge(kind, label, tabs));
  const controls = el('div', 'canvas-controls');
  const control = (text, label, action) => {
    const button = el('button', null, text);
    button.type = 'button';
    button.title = label;
    button.setAttribute('aria-label', label);
    button.addEventListener('click', action);
    controls.append(button);
    return button;
  };
  const view2d = { x: 0, y: 0, k: 1, touched: false };
  control('−', 'Zoom Out', () => zoomAt(1 / 1.2));
  const zoomLabel = el('span', 'zoom', '100%');
  controls.append(zoomLabel);
  control('+', 'Zoom In', () => zoomAt(1.2));
  control('Fit', 'Fit To Screen', () => fit());
  canvas.append(controls);
  view.append(canvas);

  function apply() {
    flow.style.transform = 'translate(' + view2d.x + 'px, ' + view2d.y + 'px) scale(' + view2d.k + ')';
    canvas.style.backgroundSize = (16 * view2d.k) + 'px ' + (16 * view2d.k) + 'px';
    canvas.style.backgroundPosition = view2d.x + 'px ' + view2d.y + 'px';
    zoomLabel.textContent = Math.round(view2d.k * 100) + '%';
  }

  function fit() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    const contentH = flow.offsetHeight;
    const contentW = flow.offsetWidth || WORLD;
    const room = width - inset;
    const byWidth = (room - 64) / contentW;
    const byHeight = (height - 96) / contentH;
    view2d.k = Math.max(0.7, Math.min(1, byWidth, byHeight));
    view2d.x = byWidth < view2d.k ? inset + 32 : inset + (room - contentW * view2d.k) / 2;
    view2d.y = byHeight < view2d.k ? 56 : Math.max(56, (height - contentH * view2d.k) / 2);
    view2d.touched = false;
    apply();
  }

  function zoomAt(factor, cx, cy) {
    const px = cx === undefined ? canvas.clientWidth / 2 : cx;
    const py = cy === undefined ? canvas.clientHeight / 2 : cy;
    const k = Math.max(0.25, Math.min(2.5, view2d.k * factor));
    view2d.x = px - (px - view2d.x) * (k / view2d.k);
    view2d.y = py - (py - view2d.y) * (k / view2d.k);
    view2d.k = k;
    view2d.touched = true;
    apply();
  }

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomAt(Math.exp(-event.deltaY * 0.0015), event.clientX - r.left, event.clientY - r.top);
  }, { passive: false });

  let drag = null;
  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.target.closest('.canvas-controls')) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, ox: view2d.x, oy: view2d.y, moved: false };
  });
  canvas.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) {
      drag.moved = true;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    }
    view2d.x = drag.ox + dx;
    view2d.y = drag.oy + dy;
    view2d.touched = true;
    apply();
  });
  const release = () => {
    if (drag && drag.moved) {
      canvas.classList.remove('dragging');
      const swallow = event => { event.stopPropagation(); event.preventDefault(); };
      window.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => window.removeEventListener('click', swallow, { capture: true }), 0);
    }
    drag = null;
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('dblclick', event => { if (!event.target.closest('.card, .canvas-controls')) fit(); });
  keys = event => {
    if (event.target.closest('input')) return;
    if (event.key === '0') fit();
    if (event.key === '+' || event.key === '=') zoomAt(1.2);
    if (event.key === '-') zoomAt(1 / 1.2);
  };
  function centerOn(x, y) {
    view2d.k = Math.max(view2d.k, 0.85);
    view2d.x = inset + (canvas.clientWidth - inset) / 2 - x * view2d.k;
    view2d.y = canvas.clientHeight / 2 - y * view2d.k;
    view2d.touched = true;
    apply();
  }
  return { canvas, world: flow, layer, fit, centerOn, touched: () => view2d.touched };
}


const SOURCES = buildSources();

function buildSources() {
  const files = new Map();
  services.forEach(s => {
    if (!s.sourceRoot) return;
    const path = type => s.sourceRoot + '/' + type.split('$')[0].replace(/\./g, '/') + '.java';
    s.aggregates.forEach(a => {
      files.set(a.name, path(a.type));
      a.useCases.forEach(u => { if (u.type) files.set(u.name, path(u.type)); });
    });
    Object.entries(s.dependencies || {}).forEach(([name, d]) => { if (d.type) files.set(name, path(d.type)); });
    if (s.blueprint) files.set(title(s.service) + 'Blueprint', s.blueprint.file);
    Object.entries(s.sources || {}).forEach(([name, source]) => { if (!files.has(name)) files.set(name, source.file); });
  });
  return files;
}

function sourceOf(service, type) {
  const own = services.find(s => s.service === service);
  if (own && own.sources && own.sources[type]) return own.sources[type];
  const any = services.find(s => s.sources && s.sources[type]);
  return any ? any.sources[type] : null;
}

function repositoryImplementation(service) {
  const own = services.find(s => s.service === service);
  return (own && own.repositoryImplementation) || 'MemoryRepository';
}

function methodSources(service, dep, method) {
  if (depKind(dep) === 'Repository') return [{ service, type: dep }, { service, type: 'Repository', member: method }, { service, type: repositoryImplementation(service), member: method }];
  const own = services.find(s => s.service === service);
  const adapters = ((own && own.adapters) || {})[dep] || [];
  return [{ service, type: dep, member: method }, ...adapters.map(a => ({ service, type: a, member: method }))];
}

function typeSources(service, dep) {
  if (depKind(dep) === 'Repository') return [{ service, type: dep }, { service, type: 'Repository' }];
  return [{ service, type: dep }];
}

function codeSnippet(ref) {
  const source = ref.source || sourceOf(ref.service, ref.type);
  if (!source) return null;
  const lines = source.text.split(String.fromCharCode(10));
  const indent = i => lines[i].match(/^ */)[0].length;
  const declares = (i, name) => new RegExp('\\b(class|interface|record|enum)\\s+' + (name || '\\w+') + '\\b').test(lines[i]);
  const decl = lines.findIndex((t, i) => declares(i, ref.type));
  if (decl < 0) return null;
  const blockEnd = start => {
    let depth = 0, opened = false;
    for (let k = start; k < lines.length; k++) {
      for (const c of lines[k]) {
        if (c === '{') { depth++; opened = true; }
        if (c === '}') depth--;
      }
      if (opened && depth <= 0) return k;
      if (!opened && lines[k].trim().endsWith(';')) return k;
    }
    return lines.length - 1;
  };
  const rows = [];
  const push = (i, kind) => rows.push({ line: i + 1, text: lines[i].trim(), indent: indent(i), hit: kind === 'hit', plain: kind === 'plain' });
  const gap = (a, b) => { if (b - a > 1) rows.push({ gap: true, indent: indent(b) }); };
  const target = ref.line ? ref.line - 1 : -1;
  const around = () => {
    const from = Math.max(decl + 1, target - 3);
    const to = Math.min(lines.length - 1, target + 3);
    push(decl, 'scope');
    gap(decl, from);
    for (let i = from; i <= to; i++) push(i, i === target ? 'hit' : 'plain');
    const close = blockEnd(decl);
    if (close > to) { gap(to, close); push(close, 'scope'); }
    return { file: source.file, rows };
  };
  if (!ref.member && target > decl) return around();
  if (!ref.member) {
    const end = Math.min(blockEnd(decl), decl + 80);
    for (let i = decl; i <= end; i++) if (lines[i].trim() || (i > decl && i < end)) push(i, 'plain');
    return { file: source.file, rows: rows.filter((r, n, all) => !(r.text === '' && all[n - 1] && all[n - 1].text === '')) };
  }
  const pattern = new RegExp('^(?!return\\b)(?:[\\w<>\\[\\]?,.]+\\s+)+' + ref.member + '\\s*\\(');
  const found = lines.findIndex((t, i) => i > decl && pattern.test(t.trim()) && !t.includes('='));
  if (found < 0) return target > decl ? around() : null;
  let start = found;
  while (start > 0 && lines[start - 1].trim().startsWith('@')) start--;
  const end = blockEnd(found);
  if (target >= 0 && (target < start || target > end)) return around();
  const scopes = [decl];
  for (let j = start - 1; j > decl; j--) if (lines[j].trim() && indent(j) < indent(found) && declares(j)) { scopes.push(j); break; }
  scopes.sort((a, b) => a - b);
  let last = -1;
  scopes.forEach(i => { if (last >= 0) gap(last, i); push(i, 'scope'); last = i; });
  gap(last, start);
  if (target >= 0) {
    let shown = -1;
    for (let i = start; i <= end; i++) {
      if (!(i <= found || Math.abs(i - target) <= 5 || i === end)) continue;
      if (shown >= 0) gap(shown, i);
      push(i, i === target ? 'hit' : 'plain');
      shown = i;
    }
  } else {
    for (let i = start; i <= end; i++) push(i, i <= found ? 'hit' : 'plain');
  }
  last = end;
  scopes.slice().reverse().forEach(i => {
    const close = blockEnd(i);
    gap(last, close);
    push(close, 'scope');
    last = close;
  });
  return { file: source.file, rows };
}

function snippetBox(snippet) {
  const box = el('div', 'inspector-code');
  box.append(el('div', 'inspector-file', snippet.file.split('/').pop()));
  snippet.rows.forEach(r => {
    const code = el('span', 'code-lines');
    code.style.setProperty('--indent', (r.indent / 2) + 'ch');
    if (r.gap) {
      const row = el('div', 'inspector-line gap');
      code.append(el('code', null, '…'));
      row.append(el('span', 'line-no', ''), code);
      box.append(row);
      return;
    }
    const row = el('a', 'inspector-line' + (r.hit ? ' hit' : r.plain ? ' plain' : ' scope'));
    row.href = ideLink(snippet.file, r.line);
    row.title = 'Open In IntelliJ';
    (r.hit && snippet.chain ? chainLines(r.text) : [r.text]).forEach(part => code.append(highlightJava(part)));
    row.append(el('span', 'line-no', String(r.line)), code);
    box.append(row);
  });
  return box;
}

function ideLink(file, line) {
  return 'idea://open?file=' + encodeURIComponent(file) + (line ? '&line=' + line : '');
}

function declarations(terms) {
  const patterns = terms.filter(Boolean).flatMap(t => [t + '.class', '"' + t + '"', '<' + t + '>']);
  const snippets = [];
  services.forEach(s => {
    if (!s.blueprint) return;
    const lines = s.blueprint.text.split(String.fromCharCode(10));
    const indent = i => lines[i].match(/^ */)[0].length;
    const closing = i => /^[)}]/.test(lines[i].trim());
    const hits = lines.map((t, i) => i).filter(i => patterns.some(p => lines[i].includes(p)));
    if (!hits.length) return;
    const shown = new Set(hits);
    hits.forEach(hit => {
      let depth = indent(hit);
      for (let j = hit - 1; j >= 0 && depth > 0; j--) {
        if (!lines[j].trim() || closing(j) || indent(j) >= depth) continue;
        if (/^(import|package) /.test(lines[j].trim())) break;
        depth = indent(j);
        shown.add(j);
        for (let k = hit + 1; k < lines.length; k++) {
          if (lines[k].trim() && indent(k) === depth && closing(k)) { shown.add(k); break; }
          if (lines[k].trim() && indent(k) < depth) break;
        }
      }
    });
    const rows = [];
    [...shown].sort((x, y) => x - y).forEach((i, n, all) => {
      if (n && i - all[n - 1] > 1) rows.push({ gap: true, indent: Math.min(indent(i), indent(all[n - 1]) + 4) });
      rows.push({ line: i + 1, text: lines[i].trim(), indent: indent(i), hit: hits.includes(i) });
    });
    snippets.push({ service: s.service, file: s.blueprint.file, rows, chain: true });
  });
  return snippets;
}

function highlightJava(text) {
  const node = el('code', 'java');
  const tokens = text.match(/"[^"]*"|\/\/.*$|\b[A-Z][A-Za-z0-9_]*\b|\b[a-z][A-Za-z0-9_]*(?=\()|\b(?:public|final|class|extends|new|import|package|static|return)\b|[^"A-Za-z]+|[a-z][A-Za-z0-9_]*/g) || [];
  tokens.forEach(t => {
    let cls = null;
    if (t.startsWith('"')) cls = 'tk-string';
    else if (t.startsWith('//')) cls = 'tk-comment';
    else if (/^(public|final|class|extends|new|import|package|static|return)$/.test(t)) cls = 'tk-keyword';
    else if (/^[A-Z]/.test(t)) cls = 'tk-type';
    else if (/^[a-z][A-Za-z0-9_]*$/.test(t) && text.includes(t + '(')) cls = 'tk-call';
    node.append(cls ? el('span', cls, t) : document.createTextNode(t));
  });
  return node;
}

function chainLines(text) {
  const parts = [];
  let depth = 0, start = 0, quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') quoted = !quoted;
    if (quoted) continue;
    if (c === '(') depth++;
    if (c === ')') depth--;
    if (c === '.' && depth === 0 && text[i - 1] === ')' && /[a-z]/.test(text[i + 1] || '')) {
      parts.push(text.slice(start, i));
      start = i;
    }
  }
  parts.push(text.slice(start));
  return parts;
}

function classTokens(text) {
  return [...new Set((text || '').match(/\b[A-Z][A-Za-z0-9]*(?:\.[A-Z][A-Za-z0-9]*)?\b/g) || [])];
}

function readSize(name) {
  try { return localStorage.getItem('blueprint:' + name); } catch (error) { return null; }
}

function resizer(host, name, edge, min, max, fallback) {
  const saved = readSize(name);
  if (saved) document.documentElement.style.setProperty('--' + name, saved + 'px');
  if (host.querySelector(':scope > .resizer[data-name="' + name + '"]')) return;
  const handle = el('div', 'resizer resizer-' + edge);
  handle.dataset.name = name;
  handle.setAttribute('role', 'separator');
  handle.setAttribute('aria-orientation', 'vertical');
  const set = width => {
    document.documentElement.style.setProperty('--' + name, width + 'px');
    try { localStorage.setItem('blueprint:' + name, String(width)); } catch (error) {}
    redraw();
  };
  handle.addEventListener('pointerdown', event => {
    event.preventDefault();
    event.stopPropagation();
    handle.setPointerCapture(event.pointerId);
    handle.classList.add('dragging');
    document.body.classList.add('resizing');
    const box = host.getBoundingClientRect();
    const others = edge === 'left' ? 0 : [...host.querySelectorAll(':scope > .resizer-left')].filter(h => h !== handle).reduce((sum, h) => sum + h.offsetLeft, 0);
    const move = e => {
      const width = edge === 'right' ? box.right - e.clientX : e.clientX - box.left - others;
      set(Math.round(Math.max(min, Math.min(max, width))));
    };
    const up = () => {
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing');
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
  handle.addEventListener('dblclick', () => {
    document.documentElement.style.removeProperty('--' + name);
    try { localStorage.removeItem('blueprint:' + name); } catch (error) {}
    redraw();
  });
  host.append(handle);
}

function inspectorFor(canvas) {
  const host = canvas.parentElement;
  let panel = host.querySelector(':scope > .inspector');
  if (!panel) {
    panel = el('aside', 'inspector');
    host.append(panel);
    resizer(host, 'inspector-w', 'right', 300, 760);
  }
  return panel;
}

function closeInspector(canvas) {
  canvas.parentElement.classList.remove('inspecting');
  canvas.querySelectorAll('.selected').forEach(n => n.classList.remove('selected'));
  redraw();
}

function inspect(canvas, info) {
  const panel = inspectorFor(canvas);
  panel.replaceChildren();
  const opening = !canvas.parentElement.classList.contains('inspecting');
  canvas.parentElement.classList.add('inspecting');
  canvas.querySelectorAll('.selected').forEach(n => n.classList.remove('selected'));
  if (info.node) info.node.classList.add('selected');
  const head = el('div', 'inspector-head');
  const titles = el('div', 'inspector-titles');
  titles.append(el('div', 'inspector-title', info.title || ''), info.kind ? el('div', 'inspector-kind', info.kind) : '');
  const close = el('button', 'inspector-close', '×');
  close.type = 'button';
  close.setAttribute('aria-label', 'Close');
  close.addEventListener('click', () => closeInspector(canvas));
  head.append(titles, close);
  panel.append(head);
  if (info.tags && info.tags.length) {
    const tags = el('div', 'inspector-tags');
    info.tags.forEach(t => tags.append(t));
    panel.append(tags);
  }
  if (info.open) {
    const open = el('button', 'inspector-open', 'Open ' + (info.openLabel || 'View'));
    open.type = 'button';
    open.addEventListener('click', info.open);
    panel.append(open);
  }
  const terms = info.terms || (info.source || info.snippets ? [] : classTokens(info.title));
  const lines = declarations(terms);
  const code = [...(info.snippets || []).map(snippet => ({ snippet })), ...(info.source || []).map(ref => ({ ref, snippet: codeSnippet(ref) }))].filter(x => x.snippet);
  if (code.length) {
    panel.append(el('div', 'inspector-label', 'Code'));
    code.forEach(x => panel.append(snippetBox(x.snippet)));
  }
  if (lines.length) {
    panel.append(el('div', 'inspector-label', 'Declared In Blueprint'));
    lines.forEach(snippet => panel.append(snippetBox(snippet)));
  }
  const classes = [...new Set([...(info.classes || []), ...(info.source || []).map(r => r.type), ...terms.map(t => t.split('.')[0])])].filter(c => SOURCES.has(c));
  if (info.service && !info.source && SOURCES.has(title(info.service) + 'Blueprint')) classes.unshift(title(info.service) + 'Blueprint');
  if (classes.length) {
    panel.append(el('div', 'inspector-label', 'Source'));
    [...new Set(classes)].forEach(c => {
      const link = el('a', 'inspector-source');
      link.href = ideLink(SOURCES.get(c));
      link.title = SOURCES.get(c);
      link.append(glyph('contracts'), el('span', 'code', c + '.java'), el('span', 'inspector-arrow', '↗'));
      panel.append(link);
    });
  }
  if (!lines.length && !classes.length && !code.length) panel.append(el('div', 'muted inspector-empty', 'No Source Found'));
  if (opening) redraw();
}

function accessTag(access) {
  const node = tag(access);
  node.classList.add('tag-access');
  if (access === 'Public') node.classList.add('tag-public');
  return node;
}

function countTag(n) {
  const node = tag(String(n));
  node.classList.add('tag-count');
  return node;
}

function annotationTags(list) {
  return (list || []).map(a => el('span', 'annotation', '@' + a));
}

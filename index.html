<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #FFFFFF;
  --panel: #F7F8FA;
  --header: #27282E;
  --header-ink: #EBECF0;
  --header-muted: #A8ADBD;
  --border: #EBECF0;
  --border-strong: #DFE1E5;
  --ink: #000000;
  --ink-2: #494B57;
  --muted: #6C707E;
  --hover: #EBECF0;
  --selection: #D4E2FF;
  --accent: #3574F0;
  --inlay-bg: #EBECF0;
  --inlay-ink: #6C707E;
  --wire: #C9CCD6;
  --dots: #D3D5DB;
  --schedule: #C27D04;
  --scroll: rgb(0 0 0 / .18);
  --scroll-hover: rgb(0 0 0 / .32);
  --blue: #3574F0;
  --green: #208A3C;
  --orange: #E56D17;
  --red: #DB3B4B;
  --purple: #834DF0;
  --teal: #039BA1;
  --icon-blue: #3574F0;
  --icon-green: #55A76A;
  --icon-orange: #E56D17;
  --icon-purple: #834DF0;
  --icon-teal: #3FB3B8;
  --icon-gray: #818594;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #1E1F22;
    --panel: #2B2D30;
    --header: #232427;
    --footer: #232427;
    --header-ink: #DFE1E5;
    --header-muted: #868A91;
    --border: #1E1F22;
    --border-strong: #393B40;
    --ink: #DFE1E5;
    --ink-2: #B4B8BF;
    --muted: #868A91;
    --hover: #393B40;
    --selection: #2E436E;
    --accent: #3574F0;
    --inlay-bg: #393B40;
    --inlay-ink: #9DA0A8;
    --wire: #4E5157;
      --dots: #2E3034;
    --schedule: #D6AE58;
    --scroll: rgb(255 255 255 / .16);
    --scroll-hover: rgb(255 255 255 / .28);
    --blue: #548AF7;
    --green: #5FAD65;
    --orange: #E08855;
    --red: #DB5C5C;
    --purple: #A571E6;
    --teal: #42B1A4;
    --icon-blue: #548AF7;
    --icon-green: #5FAD65;
    --icon-orange: #E08855;
    --icon-purple: #A571E6;
    --icon-teal: #42B1A4;
    --icon-gray: #868A91;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #1E1F22;
  --panel: #2B2D30;
  --header: #232427;
    --footer: #232427;
  --header-ink: #DFE1E5;
  --header-muted: #868A91;
  --border: #1E1F22;
  --border-strong: #393B40;
  --ink: #DFE1E5;
  --ink-2: #B4B8BF;
  --muted: #868A91;
  --hover: #393B40;
  --selection: #2E436E;
  --accent: #3574F0;
  --inlay-bg: #393B40;
  --inlay-ink: #9DA0A8;
  --wire: #4E5157;
  --dots: #2E3034;
  --schedule: #D6AE58;
  --scroll: rgb(255 255 255 / .16);
  --scroll-hover: rgb(255 255 255 / .28);
  --blue: #548AF7;
  --green: #5FAD65;
  --orange: #E08855;
  --red: #DB5C5C;
  --purple: #A571E6;
  --teal: #42B1A4;
  --icon-blue: #548AF7;
  --icon-green: #5FAD65;
  --icon-orange: #E08855;
  --icon-purple: #A571E6;
  --icon-teal: #42B1A4;
  --icon-gray: #868A91;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 13px/16px var(--font-ui); display: grid; grid-template-rows: 24px minmax(0, 1fr) 24px; }
button { font: inherit; color: inherit; }

.toolbar { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--footer, var(--panel)); border-bottom: 1px solid var(--border-strong); color: var(--muted); font-size: 12px; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.theme-toggle { flex: none; display: inline-grid; place-items: center; width: 22px; height: 20px; margin-left: auto; margin-right: -8px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.theme-toggle:hover { background: var(--hover); color: var(--ink); }
.theme-toggle svg { width: 14px; height: 14px; }
.crumbs .project { font-weight: 600; color: var(--ink-2); }
.crumbs .sep, .crumbs .page { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.search { width: 220px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); color: var(--ink); font: 13px var(--font-ui); }
.search::placeholder { color: var(--muted); }
.canvas > .search { position: absolute; top: 12px; right: 16px; z-index: 2; }
.view-head > .search { margin-left: auto; }
.view > .content > .search { display: block; margin: 0 0 12px auto; }
body > .search { display: none; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.layout { position: relative; display: grid; grid-template-columns: var(--side-w, 232px) minmax(0, 1fr); min-height: 0; }
.sidebar { background: var(--panel); border-right: 1px solid var(--border-strong); overflow-y: auto; padding: 4px 4px 12px; }
.side-label { height: 28px; display: flex; align-items: flex-end; padding: 0 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.side-item { width: 100%; height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; text-align: left; cursor: pointer; }
.side-item:hover { background: var(--hover); }
.side-item[aria-current="page"] { background: var(--selection); }
.side-item .count { margin-left: auto; color: var(--muted); font-size: 12px; }
.glyph { flex: none; width: 16px; height: 16px; color: var(--icon-blue); }

.view { overflow: auto; padding: 16px 20px 32px; min-width: 0; }
.content { max-width: 1180px; margin: 0 auto; }
.view-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.view-head h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.view-head .glyph { width: 18px; height: 18px; }

.panel { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 4px 6px; min-width: 0; }
.panel + .panel { margin-top: 12px; }
.panel-head { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.panel-head .title { font-weight: 600; }
.panel-head .kind { color: var(--muted); font: 12px var(--font-code); }
.group-label { height: 24px; display: flex; align-items: center; padding: 0 8px; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }

.icon { flex: none; width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; color: #FFFFFF; font: 600 9px/1 var(--font-ui); }
.i-aggregate { background: var(--icon-blue); }
.i-usecase { background: var(--icon-green); }
.i-event { background: var(--icon-orange); }
.i-domain { background: var(--icon-purple); }
.i-moment { background: var(--icon-teal); }
.i-schedule { background: var(--schedule); }
.i-class { background: var(--icon-gray); }
.inline { display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.code { font: 12px/16px var(--font-code); overflow-wrap: anywhere; }
.name { font-weight: 600; color: var(--ink); }
.muted { color: var(--muted); }
.method { display: inline-block; width: 4ch; flex: none; font: 700 11px/16px var(--font-code); }
.m-get { color: var(--green); } .m-post { color: var(--blue); } .m-put { color: var(--orange); } .m-patch { color: var(--purple); } .m-delete { color: var(--red); }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; background: var(--inlay-bg); color: var(--inlay-ink); font-size: 11px; white-space: nowrap; }
.link { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border: 0; border-radius: 4px; background: var(--inlay-bg); color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.link:hover { background: var(--selection); }
.link.external { color: var(--muted); cursor: default; font-weight: 400; }
.link.external:hover { background: var(--inlay-bg); }
.arrow { color: var(--muted); }
.hidden { display: none !important; }

.flow-panel { padding: 0; background-color: var(--canvas); background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 16px 16px; }
.flow-panel > .panel-head { background: var(--panel); border-bottom: 1px solid var(--border-strong); border-radius: 8px 8px 0 0; }
.view.canvas-mode { padding: 0; overflow: hidden; }
.view.canvas-mode > .content { max-width: none; height: 100%; }
.canvas { position: relative; height: 100%; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 16px 16px; cursor: grab; touch-action: none; user-select: none; }
.canvas.dragging { cursor: grabbing; }
.canvas.dragging .card { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas-title { position: absolute; top: 12px; left: 16px; z-index: 2; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); font-weight: 600; pointer-events: none; }
.canvas-controls { position: absolute; right: 16px; bottom: 16px; z-index: 2; display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); cursor: default; }
.canvas-controls button { height: 24px; min-width: 24px; padding: 0 6px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; font-size: 13px; }
.canvas-controls button:hover { background: var(--hover); }
.canvas-controls .zoom { min-width: 44px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.flow { position: relative; }
.flow > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.flow-label { position: absolute; top: 0; height: 24px; display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.card { position: absolute; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 8px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel); text-align: left; cursor: pointer; transition: opacity .12s, box-shadow .12s, border-color .12s; }
.card .card-title { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.card .card-meta { padding-left: 22px; color: var(--muted); font-size: 12px; }
.card.external { border-style: dashed; cursor: default; background: var(--canvas); }
.card.external .glyph { color: var(--icon-gray); }
.card:hover, .card.lit { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ports { display: flex; flex-direction: column; margin: 6px -12px 0; padding: 4px 6px 0; border-top: 1px solid var(--border-strong); }
.port-row { position: relative; display: flex; align-items: center; gap: 6px; height: 22px; min-width: 0; padding: 0 6px; border-radius: 4px; transition: opacity .12s, background .12s; }
.port-row.single { background: var(--hover); }
.port-row.to-right { justify-content: flex-end; }
.port-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px/16px var(--font-code); color: var(--ink-2); }
.port { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border: 2px solid var(--port, var(--wire)); border-radius: 50%; background: var(--canvas); }
.port.in { width: 0; height: 0; margin-top: -5px; border: 0; border-radius: 0; background: none; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid var(--port, var(--wire)); }
.port.unused { display: none; }
.cable.merged .glow { opacity: .06; }
.port.out { right: -18px; }
.card-title .port.out { right: -24px; }
.port.in { left: -21px; }
.card-title .port.in { left: -27px; }
.card.simple .card-title { position: static; }
.card.simple .card-title .port.out { right: -6px; }
.card.simple .card-title .port.in { left: -9px; }
.port-label.plain { font: 12px/16px var(--font-ui); color: var(--ink-2); }
.port-label .name { color: inherit; }
.port-note { margin-left: auto; padding-left: 8px; color: var(--muted); font: 11px/16px var(--font-code); white-space: nowrap; }
.port-row > .tag, .port-tags { margin-left: auto; }
.port-tags { flex: none; display: flex; align-items: center; gap: 4px; }
.port-tags > .tag-access { justify-content: center; }
.port-tags > .tag-count { min-width: 26px; justify-content: center; }
.port-row.has-sub { flex-wrap: wrap; height: auto; row-gap: 0; padding-top: 3px; padding-bottom: 3px; }
.port-row.has-sub .port { top: 11px; }
.port-sub { flex: 0 0 100%; display: flex; flex-direction: column; margin-top: -2px; font: 11px/14px var(--font-code); }
.annot-line { display: flex; align-items: center; gap: 8px; height: 14px; }
.annot-line.more .elbow::before { content: ""; position: absolute; left: -1px; top: 0; height: 14px; border-left: 1px solid var(--muted); }
.annot-line + .annot-line .elbow { height: 7px; }
.port-sub .elbow { position: relative; flex: none; align-self: flex-start; height: 9px; margin-right: -4px; border-left: 1px solid var(--muted); border-bottom: 1px solid var(--muted); border-bottom-left-radius: 4px; opacity: .7; }
.port-sub .elbow::after { content: ""; position: absolute; right: -1px; bottom: -3.5px; border-left: 4px solid var(--muted); border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
.port-sub.under-path .elbow { margin-left: 1.5ch; width: calc(2.5ch + 2px); }
.port-sub.under-icon .elbow { margin-left: 6px; width: 9px; }
.annotation { color: var(--purple); opacity: .85; }
.port-row .inline { flex-wrap: nowrap; gap: 6px; }
.port-row.wrap { height: auto; min-height: 22px; padding-top: 3px; padding-bottom: 3px; }
.port-row.wrap .port-label { white-space: normal; overflow: visible; color: var(--muted); font: 12px/16px var(--font-ui); }
.port-row.wrap { align-items: flex-start; }
.port-row.wrap .port-label { color: var(--ink-2); }
.check-mark { flex: none; width: 5px; height: 9px; margin: 2px 4px 0 3px; border-right: 1.5px solid var(--green); border-bottom: 1.5px solid var(--green); transform: rotate(40deg); }
.end-mark { flex: none; width: 8px; height: 8px; margin: 0 3px; border-radius: 2px; background: var(--muted); }
.branch-mark { flex: none; width: 8px; height: 8px; margin: 0 3px; border: 1.5px solid var(--muted); border-radius: 50%; }
.card .card-title { position: relative; min-width: 0; }
.card-name { flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-kind { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-weight: 400; white-space: nowrap; }
.card-right { flex: none; display: flex; align-items: center; gap: 4px; margin-left: auto; font-weight: 400; }
.card-tag { margin-left: auto; font-weight: 400; }
.stack { flex: none; display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 4px; background: var(--icon-gray); color: #FFFFFF; font: 700 9px/1 var(--font-ui); letter-spacing: .02em; }
.stack-logo { flex: none; width: 16px; height: 16px; background: var(--muted); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; transition: background .12s; }
.card:hover .stack-logo, .card.lit .stack-logo { background: var(--ink-2); }

.world.focus .cable:not(.lit), .world.focus .tie:not(.lit) { opacity: .14; }
.world.focus .card:not(.lit) { opacity: .4; }
.world.focus .port-row:not(.lit) { opacity: .45; }
.port-row.lit .port-label { color: var(--ink); font-weight: 700; }
.cable path { fill: none; }
.cable .glow { stroke: currentColor; stroke-width: 7; stroke-linecap: round; opacity: .16; }
.cable .core { stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: .9; }
.cable .hit { stroke: transparent; stroke-width: 12; pointer-events: stroke; }
.cable { transition: opacity .12s; }
.tie-band { fill: var(--icon-gray); stroke: var(--canvas); stroke-width: 1; }
.tie-head { fill: var(--ink-2); stroke: var(--canvas); stroke-width: 1; }
.tie { transition: opacity .12s; }
.flow.focus .cable:not(.lit), .flow.focus .tie:not(.lit) { opacity: .14; }
.flow.focus .cable.lit .glow { opacity: .32; }
.flow.focus .cable.lit .core { stroke-width: 2.5; opacity: 1; }
.flow.focus .card:not(.lit) { opacity: .4; }
.flow.focus .port-row:not(.lit) { opacity: .45; }
.connections { display: none; }
.connection { padding: 6px 8px; border-radius: 4px; }
.connection:hover { background: var(--hover); }
.connection .events-of { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; }

.neighbors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.neighbors .panel { margin: 0; padding-bottom: 10px; }
.neighbors .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px; }

.routes { display: grid; grid-template-columns: minmax(240px, 1.25fr) 20px minmax(170px, 1fr) minmax(150px, 1fr); }
.routes .route { display: contents; }
.routes .route > * { display: flex; align-items: center; min-height: 32px; padding: 6px 8px; border-top: 1px solid var(--border-strong); min-width: 0; }
.routes .route > .trigger { border-radius: 4px 0 0 4px; }
.routes .route > .uses { color: var(--muted); font: 12px/16px var(--font-code); overflow-wrap: anywhere; border-radius: 0 4px 4px 0; }
.routes .route > .arrow { justify-content: center; padding: 0; }
.routes .head > * { min-height: 24px; padding-top: 2px; padding-bottom: 2px; border-top: 0; font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--font-ui); }
.routes .route:not(.head):hover > *, .routes .route.lit > * { background: var(--hover); }
.routes .route.lit > * { background: var(--selection); }
.routes .trigger .inline { gap: 6px 8px; }
.publishes .row { display: grid; grid-template-columns: minmax(240px, 1.25fr) 20px minmax(170px, 1fr) minmax(150px, 1fr); }
.publishes .row > * { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 32px; padding: 6px 8px; border-top: 1px solid var(--border-strong); min-width: 0; }
.publishes .row > .arrow { justify-content: center; padding: 0; }
.publishes .row:not(.head):hover > * { background: var(--hover); }
.publishes .head > * { min-height: 24px; padding-top: 2px; padding-bottom: 2px; border-top: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
details > summary { list-style: none; height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 8px; margin-top: 4px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; border-left: 4px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; margin-right: 4px; transition: transform .1s; }
details[open] > summary::before { transform: rotate(90deg); }
details > summary:hover { background: var(--hover); }
.moment { display: flex; align-items: center; gap: 6px; min-height: 24px; padding: 4px 8px; border-radius: 4px; }
.moment:hover { background: var(--hover); }
.moment .from { margin-left: auto; color: var(--muted); font: 12px var(--font-code); }

.side-parent .chevron { width: 0; height: 0; margin: 0 2px 0 -2px; border-left: 4px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transform: rotate(90deg); }
.side-item.side-child { padding-left: 34px; }
.side-leaf .chevron { visibility: hidden; }
.picker-link { cursor: pointer; }
.picker-link:hover { color: var(--ink); text-decoration: underline; }
.picker-service[aria-current="true"] { background: var(--selection); color: var(--ink); }
.i-port { background: var(--teal); }
.picker-stale .picker-text { font-style: italic; color: var(--muted); }
.side-item.side-grandchild { padding-left: 52px; color: var(--ink-2); }
.side-parent + .side-parent, .side-child + .side-parent, .side-grandchild + .side-parent, .side-top + .side-parent { margin-top: 8px; }
.service-dot { flex: none; width: 8px; height: 8px; margin: 0 4px 0 3px; border-radius: 2px; }
.side-service .side-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-service .stack-logo { width: 14px; height: 14px; margin-left: auto; }
.side-service .stack-logo + .stack-logo { margin-left: 0; }
.side-service .stack-logo ~ .count { margin-left: 6px; min-width: 14px; text-align: right; }
.side-service:hover .stack-logo, .side-service[aria-current="page"] .stack-logo { background: var(--ink-2); }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.title-link { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; margin-left: -4px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; }
.title-link:hover { background: var(--hover); }

      "text": "package dev.blueprint.runtime;\n\nimport dev.blueprint.api.AggregateRoot;\nimport dev.blueprint.api.Repository;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.function.Function;\n\npublic final class MemoryRepository<A extends AggregateRoot, ID> implements Repository<A, ID> {\n\n    private record Row(String json, long version) {\n    }\n\n    private final ServiceRuntime runtime;\n    private final Class<A> type;\n    private final Function<A, ID> identity;\n    private final Map<Object, Row> rows = new ConcurrentHashMap<>();\n\n    MemoryRepository(ServiceRuntime runtime, Class<A> type, Function<A, ID> identity) {\n        this.runtime = runtime;\n        this.type = type;\n        this.identity = identity;\n    }\n\n    @Override\n    public A load(ID id) {\n        return find(id).orElseThrow(() -> new NotFound(type.getSimpleName() + \" \" + id + \" not found\"));\n    }\n\n    @Override\n    public Optional<A> find(ID id) {\n        var tx = Tx.current(runtime);\n        var staged = tx.staged(this, id);\n        if (staged != null) {\n            return Optional.of(Json.read(staged.json(), type));\n        }\n        var row = rows.get(id);\n        if (row == null) {\n            return Optional.empty();\n        }\n        tx.read(this, id, row.version());\n        return Optional.of(Json.read(row.json(), type));\n    }\n\n    @Override\n    public void insert(A aggregate) {\n        stage(aggregate, true);\n    }\n\n    @Override\n    public void save(A aggregate) {\n        stage(aggregate, false);\n    }\n\n    private void stage(A aggregate, boolean insert) {\n        var tx = Tx.current(runtime);\n        var id = identity.apply(aggregate);\n        var previous = tx.staged(this, id);\n        var asInsert = insert || (previous != null && previous.insert());\n        if (!asInsert && tx.readVersion(this, id) == null) {\n            throw new IllegalStateException(\"save without load: \" + type.getSimpleName() + \" \" + id);\n        }\n        tx.write(this, id, new Tx.Write(Json.write(aggregate), asInsert));\n        tx.events.addAll(aggregate.pullEvents());\n    }\n\n    List<String> rows() {\n        return rows.values().stream().map(Row::json).toList();\n    }\n\n    void check(Object id, Tx.Write write, Long readVersion) {\n        var row = rows.get(id);\n        if (write.insert() && row != null) {\n            throw new Conflict(type.getSimpleName() + \" \" + id + \" already exists\");\n        }\n        if (!write.insert() && (row == null || row.version() != readVersion)) {\n            throw new Conflict(type.getSimpleName() + \" \" + id + \" changed concurrently\");\n        }\n    }\n\n    void apply(Object id, Tx.Write write) {\n        var row = rows.get(id);\n        rows.put(id, new Row(write.json(), row == null ? 1 : row.version() + 1));\n    }\n}\n"

      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.UseCase;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.PositiveOrZero;\n\npublic final class AddStock implements UseCase {\n\n    public record Input(@NotBlank String sku, @PositiveOrZero int quantity) {\n    }\n\n    public record Output(String id) {\n    }\n\n    private final StockRepository stockRepository;\n\n    public AddStock(StockRepository stockRepository) {\n        this.stockRepository = stockRepository;\n    }\n\n    public Output execute(Input input) {\n        var item = Stock.add(new Sku(input.sku()), input.quantity());\n        stockRepository.insert(item);\n        return new Output(item.id().value());\n    }\n}\n"
    },
    "GetStock": {
      "file": "services/inventory/inventory/src/main/java/dev/inventory/stock/GetStock.java",
      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.UseCase;\n\npublic final class GetStock implements UseCase {\n\n    public record Input(Sku sku) {\n    }\n\n    public record Output(String sku, int available, int reserved) {\n    }\n\n    private final StockRepository stockRepository;\n\n    public GetStock(StockRepository stockRepository) {\n        this.stockRepository = stockRepository;\n    }\n\n    public Output execute(Input input) {\n        var item = stockRepository.load(input.sku());\n        return new Output(item.id().value(), item.available(), item.reserved());\n    }\n}\n"
    },
    "ReserveStock": {
      "file": "services/inventory/inventory/src/main/java/dev/inventory/stock/ReserveStock.java",
      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.Events;\nimport dev.blueprint.api.UseCase;\nimport dev.inventory.contracts.StockReserved;\nimport dev.inventory.contracts.StockUnavailable;\nimport dev.orders.contracts.OrderPlaced;\nimport java.util.ArrayList;\n\npublic final class ReserveStock implements UseCase {\n\n    private final StockRepository stockRepository;\n    private final Events events;\n\n    public ReserveStock(StockRepository stockRepository, Events events) {\n        this.stockRepository = stockRepository;\n        this.events = events;\n    }\n\n    public void execute(OrderPlaced order) {\n        var reserved = new ArrayList<Stock>();\n        for (var line : order.lines()) {\n            var item = stockRepository.find(new Sku(line.sku()));\n            if (item.isEmpty() || !item.get().canReserve(line.quantity())) {\n                events.publish(new StockUnavailable(order.orderId(), line.sku()));\n                return;\n            }\n            item.get().reserve(line.quantity());\n            reserved.add(item.get());\n        }\n        reserved.forEach(stockRepository::save);\n        events.publish(new StockReserved(order.orderId()));\n    }\n}\n"
    },

      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.UseCase;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Positive;\n\npublic final class Restock implements UseCase {\n\n    public record Input(@NotNull Sku sku, @Positive int quantity) {\n    }\n\n    private final StockRepository stockRepository;\n\n    public Restock(StockRepository stockRepository) {\n        this.stockRepository = stockRepository;\n    }\n\n    public void execute(Input input) {\n        var item = stockRepository.load(input.sku());\n        item.restock(input.quantity());\n        stockRepository.save(item);\n    }\n}\n"
    },

      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.DomainError;\n\npublic record Sku(String value) {\n\n    public static final class Invalid extends DomainError {\n        Invalid() {\n            super(\"SKU_INVALID\", \"a sku cannot be blank\");\n        }\n    }\n\n    public Sku {\n        if (value == null || value.isBlank()) {\n            throw new Invalid();\n        }\n    }\n}\n"

      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.AggregateRoot;\n\npublic final class Stock extends AggregateRoot {\n\n    private Sku id;\n    private int available;\n    private int reserved;\n\n    private Stock() {\n    }\n\n    public static Stock add(Sku sku, int quantity) {\n        if (quantity < 0) {\n            throw new StockError.InvalidQuantity(quantity);\n        }\n        var stock = new Stock();\n        stock.id = sku;\n        stock.available = quantity;\n        return stock;\n    }\n\n    public void restock(int quantity) {\n        if (quantity <= 0) {\n            throw new StockError.InvalidQuantity(quantity);\n        }\n        available += quantity;\n    }\n\n    public boolean canReserve(int quantity) {\n        return quantity <= available;\n    }\n\n    public void reserve(int quantity) {\n        if (!canReserve(quantity)) {\n            throw new StockError.Insufficient(id, available);\n        }\n        available -= quantity;\n        reserved += quantity;\n    }\n\n    public Sku id() {\n        return id;\n    }\n\n    public int available() {\n        return available;\n    }\n\n    public int reserved() {\n        return reserved;\n    }\n}\n"
    },

      "text": "package dev.inventory.stock;\n\nimport dev.blueprint.api.DomainError;\n\npublic sealed abstract class StockError extends DomainError {\n\n    private StockError(String code, String message) {\n        super(code, message);\n    }\n\n    public static final class InvalidQuantity extends StockError {\n        InvalidQuantity(int quantity) {\n            super(\"STOCK_INVALID_QUANTITY\", quantity + \" is not a valid quantity\");\n        }\n    }\n\n    public static final class Insufficient extends StockError {\n        Insufficient(Sku sku, int available) {\n            super(\"STOCK_INSUFFICIENT\", \"only \" + available + \" of \" + sku.value() + \" left\");\n        }\n    }\n}\n"

      "text": "package dev.blueprint.api;\n\nimport java.util.Optional;\n\npublic interface Repository<A extends AggregateRoot, ID> {\n\n    A load(ID id);\n\n    Optional<A> find(ID id);\n\n    void insert(A aggregate);\n\n    void save(A aggregate);\n}\n"

    "Repositories": {
      "file": "framework/blueprint-quarkus/src/main/java/dev/blueprint/quarkus/Repositories.java",
      "text": "package dev.blueprint.quarkus;\n\nimport dev.blueprint.api.AggregateRoot;\nimport dev.blueprint.api.Repository;\nimport io.agroal.api.AgroalDataSource;\nimport jakarta.enterprise.context.ApplicationScoped;\nimport jakarta.inject.Inject;\nimport jakarta.transaction.TransactionSynchronizationRegistry;\nimport jakarta.ws.rs.NotFoundException;\nimport java.lang.reflect.InvocationHandler;\nimport java.lang.reflect.InvocationTargetException;\nimport java.lang.reflect.Proxy;\nimport java.sql.SQLException;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.function.Function;\n\n@ApplicationScoped\npublic class Repositories {\n\n    @Inject\n    AgroalDataSource dataSource;\n\n    @Inject\n    TransactionSynchronizationRegistry transactions;\n\n    @Inject\n    Outbox outbox;\n\n    public <A extends AggregateRoot, ID> Repository<A, ID> of(Class<A> type, Function<A, ID> identity) {\n        return new Jdbc<>(type, identity);\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    public <A extends AggregateRoot, ID, R extends Repository<A, ID>> R of(Class<A> type, Function<A, ID> identity, Class<R> port) {\n        var repository = of(type, identity);\n        return (R) Proxy.newProxyInstance(port.getClassLoader(), new Class<?>[] {port}, (proxy, method, args) -> {\n            if (method.isDefault()) {\n                return InvocationHandler.invokeDefault(proxy, method, args);\n            }\n            try {\n                return Repository.class.getMethod(method.getName(), method.getParameterTypes()).invoke(repository, args);\n            } catch (NoSuchMethodException e) {\n                return method.invoke(repository, args);\n            } catch (InvocationTargetException e) {\n                throw e.getCause();\n            }\n        });\n    }\n\n    private final class Jdbc<A extends AggregateRoot, ID> implements Repository<A, ID> {\n\n        private final Class<A> type;\n        private final Function<A, ID> identity;\n\n        Jdbc(Class<A> type, Function<A, ID> identity) {\n            this.type = type;\n            this.identity = identity;\n        }\n\n        @Override\n        public A load(ID id) {\n            return find(id).orElseThrow(() -> new NotFoundException(type.getSimpleName() + \" \" + key(id) + \" not found\"));\n        }\n\n        @Override\n        public Optional<A> find(ID id) {\n            try (var connection = dataSource.getConnection();\n                 var select = connection.prepareStatement(\"select version, body from aggregates where type = ? and id = ?\")) {\n                select.setString(1, type.getName());\n                select.setString(2, key(id));\n                var row = select.executeQuery();\n                if (!row.next()) {\n                    return Optional.empty();\n                }\n                versions().put(key(id), row.getLong(1));\n                return Optional.of(Documents.read(row.getString(2), type));\n            } catch (SQLException e) {\n                throw new IllegalStateException(e);\n            }\n        }\n\n        @Override\n        public void insert(A aggregate) {\n            var id = key(identity.apply(aggregate));\n            try (var connection = dataSource.getConnection();\n                 var insert = connection.prepareStatement(\"insert into aggregates (type, id, version, body) values (?, ?, 1, ?) on conflict do nothing\")) {\n                insert.setString(1, type.getName());\n                insert.setString(2, id);\n                insert.setString(3, Documents.write(aggregate));\n                if (insert.executeUpdate() == 0) {\n                    throw new Conflict(type.getSimpleName() + \" \" + id + \" already exists\");\n                }\n            } catch (SQLException e) {\n                throw new IllegalStateException(e);\n            }\n            outbox.append(aggregate.pullEvents());\n        }\n\n        @Override\n        public void save(A aggregate) {\n            var id = key(identity.apply(aggregate));\n            var version = versions().get(id);\n            if (version == null) {\n                throw new IllegalStateException(\"save without load: \" + type.getSimpleName() + \" \" + id);\n            }\n            try (var connection = dataSource.getConnection();\n                 var update = connection.prepareStatement(\"update aggregates set version = version + 1, body = ? where type = ? and id = ? and version = ?\")) {\n                update.setString(1, Documents.write(aggregate));\n                update.setString(2, type.getName());\n                update.setString(3, id);\n                update.setLong(4, version);\n                if (update.executeUpdate() == 0) {\n                    throw new Conflict(type.getSimpleName() + \" \" + id + \" changed concurrently\");\n                }\n                versions().put(id, version + 1);\n            } catch (SQLException e) {\n                throw new IllegalStateException(e);\n            }\n            outbox.append(aggregate.pullEvents());\n        }\n\n        @SuppressWarnings(\"unchecked\")\n        private Map<String, Long> versions() {\n            var key = \"blueprint:\" + type.getName();\n            var versions = (Map<String, Long>) transactions.getResource(key);\n            if (versions == null) {\n                versions = new HashMap<>();\n                transactions.putResource(key, versions);\n            }\n            return versions;\n        }\n\n        private String key(Object id) {\n            var components = id.getClass().getRecordComponents();\n            try {\n                return (String) components[0].getAccessor().invoke(id);\n            } catch (ReflectiveOperationException e) {\n                throw new IllegalStateException(e);\n            }\n        }\n    }\n}\n"
    }

    "text": "package dev.orders;\n\nimport dev.blueprint.dsl.Aggregate;\nimport dev.blueprint.dsl.Blueprint;\nimport dev.inventory.contracts.StockReserved;\nimport dev.inventory.contracts.StockUnavailable;\nimport dev.orders.contracts.OrderCancelled;\nimport dev.orders.contracts.OrderConfirmed;\nimport dev.orders.contracts.OrderPlaced;\nimport dev.orders.contracts.OrderRejected;\nimport dev.orders.customer.BlockCustomer;\nimport dev.orders.customer.CountConfirmedOrder;\nimport dev.orders.customer.Customer;\nimport dev.orders.customer.GetCustomer;\nimport dev.orders.customer.RegisterCustomer;\nimport dev.orders.order.CancelOrder;\nimport dev.orders.order.Checkout;\nimport dev.orders.order.DeclineOrderPayment;\nimport dev.orders.order.ExpireStaleOrders;\nimport dev.orders.order.GetOrder;\nimport dev.orders.order.ListOrders;\nimport dev.orders.order.MarkOrderPaid;\nimport dev.orders.order.MarkOrderReserved;\nimport dev.orders.order.Order;\nimport dev.orders.order.OrderEvent;\nimport dev.orders.order.OrderImportResource;\nimport dev.orders.order.PlaceOrder;\nimport dev.orders.order.RejectOrderOutOfStock;\nimport dev.payments.contracts.PaymentConfirmed;\nimport dev.payments.contracts.PaymentDeclined;\n\npublic final class OrdersBlueprint extends Blueprint {{\n\n    aggregate(new Aggregate<Order>() {{\n        path(\"/orders\");\n\n        endpoints(\n            post().to(PlaceOrder.class),\n            post(\"/{id}/cancel\").to(CancelOrder.class),\n            post(\"/checkout\").to(Checkout.class),\n            post(\"/import\").manual(OrderImportResource.class),\n            get(\"/{id}\").to(GetOrder.class),\n            get().to(ListOrders.class)\n        );\n\n        policies(\n            authorize(PlaceOrder.class).permissionsAllowed(\"orders:create\"),\n            authorize(CancelOrder.class).permissionsAllowed(\"orders:cancel\"),\n            authorize(Checkout.class).permissionsAllowed(\"orders:create\"),\n            authorize(GetOrder.class).permitAll(),\n            authorize(ListOrders.class).permitAll()\n        );\n\n        events(\n            publish(OrderPlaced.class).from(OrderEvent.Placed.class),\n            publish(OrderConfirmed.class).from(OrderEvent.Confirmed.class),\n            publish(OrderCancelled.class).from(OrderEvent.Cancelled.class),\n            publish(OrderRejected.class).from(OrderEvent.Rejected.class),\n            on(PaymentConfirmed.class).to(MarkOrderPaid.class),\n            on(PaymentDeclined.class).to(DeclineOrderPayment.class),\n            on(StockReserved.class).to(MarkOrderReserved.class),\n            on(StockUnavailable.class).to(RejectOrderOutOfStock.class)\n        );\n\n        schedules(\n            every(\"1m\").to(ExpireStaleOrders.class)\n        );\n\n        annotations(\n            annotate(PlaceOrder.class).with(Audited.class),\n            annotate(CancelOrder.class).with(Audited.class)\n        );\n    }});\n\n    aggregate(new Aggregate<Customer>() {{\n        path(\"/customers\");\n\n        endpoints(\n            post().to(RegisterCustomer.class),\n            post(\"/{id}/block\").to(BlockCustomer.class),\n            get(\"/{id}\").to(GetCustomer.class)\n        );\n\n        policies(\n            authorize(RegisterCustomer.class).permissionsAllowed(\"customers:write\"),\n            authorize(BlockCustomer.class).permissionsAllowed(\"customers:write\"),\n            authorize(GetCustomer.class).permitAll()\n        );\n\n        domainEvents(\n            on(OrderEvent.Confirmed.class).to(CountConfirmedOrder.class)\n        );\n    }});\n}}\n"
  },

    "OrdersApp": {
      "file": "services/orders/app/src/main/java/dev/orders/app/OrdersApp.java",
      "text": "package dev.orders.app;\n\nimport dev.blueprint.runtime.Broker;\nimport dev.blueprint.runtime.Http;\nimport dev.blueprint.runtime.ServiceRuntime;\nimport dev.orders.app.adapters.MemoryOrderQueries;\nimport dev.orders.app.generated.OrdersModule;\nimport java.time.Clock;\n\npublic final class OrdersApp {\n\n    private OrdersApp() {\n    }\n\n    public static Http start(Broker broker, int port) {\n        return start(new ServiceRuntime(\"orders\", broker, Clock.systemUTC()), port);\n    }\n\n    public static Http start(ServiceRuntime runtime, int port) {\n        var http = new Http(port);\n        new OrdersModule(runtime, new MemoryOrderQueries(runtime)).bind(http);\n        http.start();\n        return http;\n    }\n}\n"
    },
    "MemoryOrderQueries": {
      "file": "services/orders/app/src/main/java/dev/orders/app/adapters/MemoryOrderQueries.java",
      "text": "package dev.orders.app.adapters;\n\nimport dev.blueprint.api.Page;\nimport dev.blueprint.runtime.ServiceRuntime;\nimport dev.orders.order.Order;\nimport dev.orders.order.OrderId;\nimport dev.orders.order.OrderQueries;\nimport dev.orders.order.OrderSummary;\nimport java.time.Instant;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Map;\n\npublic final class MemoryOrderQueries implements OrderQueries {\n\n    private final ServiceRuntime runtime;\n\n    public MemoryOrderQueries(ServiceRuntime runtime) {\n        this.runtime = runtime;\n    }\n\n    @Override\n    public Page<OrderSummary> withStatus(String status, int page, int size) {\n        var matching = runtime.documents(Order.class).stream()\n                .filter(order -> status == null || status.equals(order.get(\"status\")))\n                .sorted(Comparator.comparing(order -> (String) order.get(\"placedAt\")))\n                .map(order -> new OrderSummary(id(order), (String) order.get(\"customer\"),\n                        ((Number) order.get(\"total\")).longValue(), (String) order.get(\"status\")))\n                .toList();\n        return Page.of(matching, page, size);\n    }\n\n    @Override\n    public List<OrderId> placedBefore(Instant cutoff) {\n        return runtime.documents(Order.class).stream()\n                .filter(order -> \"PLACED\".equals(order.get(\"status\")))\n                .filter(order -> Instant.parse((String) order.get(\"placedAt\")).isBefore(cutoff))\n                .map(order -> new OrderId(id(order)))\n                .toList();\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    private static String id(Map<String, Object> order) {\n        return (String) ((Map<String, Object>) order.get(\"id\")).get(\"value\");\n    }\n}\n"
    },

    "OrdersBlueprint": {
      "file": "services/orders/orders/src/main/java/dev/orders/OrdersBlueprint.java",
      "text": "package dev.orders;\n\nimport dev.blueprint.dsl.Aggregate;\nimport dev.blueprint.dsl.Blueprint;\nimport dev.inventory.contracts.StockReserved;\nimport dev.inventory.contracts.StockUnavailable;\nimport dev.orders.contracts.OrderCancelled;\nimport dev.orders.contracts.OrderConfirmed;\nimport dev.orders.contracts.OrderPlaced;\nimport dev.orders.contracts.OrderRejected;\nimport dev.orders.customer.BlockCustomer;\nimport dev.orders.customer.CountConfirmedOrder;\nimport dev.orders.customer.Customer;\nimport dev.orders.customer.GetCustomer;\nimport dev.orders.customer.RegisterCustomer;\nimport dev.orders.order.CancelOrder;\nimport dev.orders.order.Checkout;\nimport dev.orders.order.DeclineOrderPayment;\nimport dev.orders.order.ExpireStaleOrders;\nimport dev.orders.order.GetOrder;\nimport dev.orders.order.ListOrders;\nimport dev.orders.order.MarkOrderPaid;\nimport dev.orders.order.MarkOrderReserved;\nimport dev.orders.order.Order;\nimport dev.orders.order.OrderEvent;\nimport dev.orders.order.OrderImportResource;\nimport dev.orders.order.PlaceOrder;\nimport dev.orders.order.RejectOrderOutOfStock;\nimport dev.payments.contracts.PaymentConfirmed;\nimport dev.payments.contracts.PaymentDeclined;\n\npublic final class OrdersBlueprint extends Blueprint {{\n\n    aggregate(new Aggregate<Order>() {{\n        path(\"/orders\");\n\n        endpoints(\n            post().to(PlaceOrder.class),\n            post(\"/{id}/cancel\").to(CancelOrder.class),\n            post(\"/checkout\").to(Checkout.class),\n            post(\"/import\").manual(OrderImportResource.class),\n            get(\"/{id}\").to(GetOrder.class),\n            get().to(ListOrders.class)\n        );\n\n        policies(\n            authorize(PlaceOrder.class).permissionsAllowed(\"orders:create\"),\n            authorize(CancelOrder.class).permissionsAllowed(\"orders:cancel\"),\n            authorize(Checkout.class).permissionsAllowed(\"orders:create\"),\n            authorize(GetOrder.class).permitAll(),\n            authorize(ListOrders.class).permitAll()\n        );\n\n        events(\n            publish(OrderPlaced.class).from(OrderEvent.Placed.class),\n            publish(OrderConfirmed.class).from(OrderEvent.Confirmed.class),\n            publish(OrderCancelled.class).from(OrderEvent.Cancelled.class),\n            publish(OrderRejected.class).from(OrderEvent.Rejected.class),\n            on(PaymentConfirmed.class).to(MarkOrderPaid.class),\n            on(PaymentDeclined.class).to(DeclineOrderPayment.class),\n            on(StockReserved.class).to(MarkOrderReserved.class),\n            on(StockUnavailable.class).to(RejectOrderOutOfStock.class)\n        );\n\n        schedules(\n            every(\"1m\").to(ExpireStaleOrders.class)\n        );\n\n        annotations(\n            annotate(PlaceOrder.class).with(Audited.class),\n            annotate(CancelOrder.class).with(Audited.class)\n        );\n    }});\n\n    aggregate(new Aggregate<Customer>() {{\n        path(\"/customers\");\n\n        endpoints(\n            post().to(RegisterCustomer.class),\n            post(\"/{id}/block\").to(BlockCustomer.class),\n            get(\"/{id}\").to(GetCustomer.class)\n        );\n\n        policies(\n            authorize(RegisterCustomer.class).permissionsAllowed(\"customers:write\"),\n            authorize(BlockCustomer.class).permissionsAllowed(\"customers:write\"),\n            authorize(GetCustomer.class).permitAll()\n        );\n\n        domainEvents(\n            on(OrderEvent.Confirmed.class).to(CountConfirmedOrder.class)\n        );\n    }});\n}}\n"
    },

      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.UseCase;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\n\npublic final class BlockCustomer implements UseCase {\n\n    public record Input(@NotNull CustomerId customer, @NotBlank String reason) {\n    }\n\n    private final CustomerRepository customerRepository;\n\n    public BlockCustomer(CustomerRepository customerRepository) {\n        this.customerRepository = customerRepository;\n    }\n\n    public void execute(Input input) {\n        var customer = customerRepository.load(input.customer());\n        customer.block(input.reason());\n        customerRepository.save(customer);\n    }\n}\n"
    },
    "CountConfirmedOrder": {
      "file": "services/orders/orders/src/main/java/dev/orders/customer/CountConfirmedOrder.java",
      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.UseCase;\nimport dev.orders.order.OrderEvent;\nimport dev.orders.order.OrderRepository;\n\npublic final class CountConfirmedOrder implements UseCase {\n\n    private final OrderRepository orderRepository;\n    private final CustomerRepository customerRepository;\n\n    public CountConfirmedOrder(OrderRepository orderRepository, CustomerRepository customerRepository) {\n        this.orderRepository = orderRepository;\n        this.customerRepository = customerRepository;\n    }\n\n    public void execute(OrderEvent.Confirmed event) {\n        var order = orderRepository.load(event.orderId());\n        customerRepository.find(new CustomerId(order.customer())).ifPresent(customer -> {\n            customer.countConfirmedOrder();\n            customerRepository.save(customer);\n        });\n    }\n}\n"
    },
    "Customer": {
      "file": "services/orders/orders/src/main/java/dev/orders/customer/Customer.java",
      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.AggregateRoot;\n\npublic final class Customer extends AggregateRoot {\n\n    private CustomerId id;\n    private String name;\n    private Email email;\n    private boolean blocked;\n    private String blockReason;\n    private int confirmedOrders;\n\n    private Customer() {\n    }\n\n    public static Customer register(String name, Email email) {\n        var customer = new Customer();\n        customer.id = CustomerId.next();\n        customer.name = name;\n        customer.email = email;\n        return customer;\n    }\n\n    public void block(String reason) {\n        if (blocked) {\n            throw new CustomerError.AlreadyBlocked(id);\n        }\n        blocked = true;\n        blockReason = reason;\n    }\n\n    public void ensureCanOrder() {\n        if (blocked) {\n            throw new CustomerError.Blocked(id);\n        }\n    }\n\n    public void countConfirmedOrder() {\n        confirmedOrders++;\n    }\n\n    public CustomerId id() {\n        return id;\n    }\n\n    public String name() {\n        return name;\n    }\n\n    public Email email() {\n        return email;\n    }\n\n    public boolean blocked() {\n        return blocked;\n    }\n\n    public int confirmedOrders() {\n        return confirmedOrders;\n    }\n}\n"
    },
    "CustomerError": {
      "file": "services/orders/orders/src/main/java/dev/orders/customer/CustomerError.java",
      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.DomainError;\n\npublic sealed abstract class CustomerError extends DomainError {\n\n    private CustomerError(String code, String message) {\n        super(code, message);\n    }\n\n    public static final class AlreadyBlocked extends CustomerError {\n        AlreadyBlocked(CustomerId id) {\n            super(\"CUSTOMER_ALREADY_BLOCKED\", \"customer \" + id.value() + \" is already blocked\");\n        }\n    }\n\n    public static final class Blocked extends CustomerError {\n        Blocked(CustomerId id) {\n            super(\"CUSTOMER_BLOCKED\", \"customer \" + id.value() + \" is blocked and cannot place orders\");\n        }\n    }\n}\n"
    },

      "file": "services/orders/orders/src/main/java/dev/orders/customer/CustomerId.java",
      "text": "package dev.orders.customer;\n\nimport java.util.UUID;\n\npublic record CustomerId(String value) {\n\n    public static CustomerId next() {\n        return new CustomerId(UUID.randomUUID().toString());\n    }\n}\n"

      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.Repository;\n\npublic interface CustomerRepository extends Repository<Customer, CustomerId> {\n}\n"

    "Email": {
      "file": "services/orders/orders/src/main/java/dev/orders/customer/Email.java",
      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.DomainError;\n\npublic record Email(String value) {\n\n    public static final class Invalid extends DomainError {\n        Invalid(String value) {\n            super(\"EMAIL_INVALID\", value + \" is not a valid email\");\n        }\n    }\n\n    public Email {\n        if (value == null || !value.matches(\"[^@\\\\s]+@[^@\\\\s]+\\\\.[^@\\\\s]+\")) {\n            throw new Invalid(value);\n        }\n    }\n}\n"
    },
    "GetCustomer": {
      "file": "services/orders/orders/src/main/java/dev/orders/customer/GetCustomer.java",
      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.UseCase;\n\npublic final class GetCustomer implements UseCase {\n\n    public record Input(CustomerId customer) {\n    }\n\n    public record Output(String id, String name, String email, boolean blocked, int confirmedOrders) {\n    }\n\n    private final CustomerRepository customerRepository;\n\n    public GetCustomer(CustomerRepository customerRepository) {\n        this.customerRepository = customerRepository;\n    }\n\n    public Output execute(Input input) {\n        var customer = customerRepository.load(input.customer());\n        return new Output(customer.id().value(), customer.name(), customer.email().value(), customer.blocked(), customer.confirmedOrders());\n    }\n}\n"
    },
    "RegisterCustomer": {
      "file": "services/orders/orders/src/main/java/dev/orders/customer/RegisterCustomer.java",
      "text": "package dev.orders.customer;\n\nimport dev.blueprint.api.UseCase;\nimport jakarta.validation.constraints.NotBlank;\n\npublic final class RegisterCustomer implements UseCase {\n\n    public record Input(@NotBlank String name, @NotBlank @jakarta.validation.constraints.Email String email) {\n    }\n\n    public record Output(String id) {\n    }\n\n    private final CustomerRepository customerRepository;\n\n    public RegisterCustomer(CustomerRepository customerRepository) {\n        this.customerRepository = customerRepository;\n    }\n\n    public Output execute(Input input) {\n        var customer = Customer.register(input.name(), new Email(input.email()));\n        customerRepository.insert(customer);\n        return new Output(customer.id().value());\n    }\n}\n"
    },

      "text": "package dev.orders.order;\n\nimport dev.blueprint.api.UseCase;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\n\npublic final class CancelOrder implements UseCase {\n\n    public record Input(@NotNull OrderId order, @NotBlank String reason) {\n    }\n\n    private final OrderRepository orderRepository;\n\n    public CancelOrder(OrderRepository orderRepository) {\n        this.orderRepository = orderRepository;\n    }\n\n    public void execute(Input input) {\n        var order = orderRepository.load(input.order());\n        order.cancel(input.reason());\n        orderRepository.save(order);\n    }\n}\n"

      "text": "package dev.orders.order;\n\nimport dev.blueprint.api.Tick;\nimport dev.blueprint.api.UseCase;\nimport java.time.Duration;\n\npublic final class ExpireStaleOrders implements UseCase {\n\n    private static final Duration TIME_TO_PAY = Duration.ofMinutes(30);\n\n    private final OrderQueries orderQueries;\n    private final OrderRepository orderRepository;\n\n    public ExpireStaleOrders(OrderQueries orderQueries, OrderRepository orderRepository) {\n        this.orderQueries = orderQueries;\n        this.orderRepository = orderRepository;\n    }\n\n    public void execute(Tick tick) {\n        var cutoff = tick.at().minus(TIME_TO_PAY);\n        for (var id : orderQueries.placedBefore(cutoff)) {\n            var order = orderRepository.load(id);\n            order.expireIfPlacedBefore(cutoff);\n            orderRepository.save(order);\n        }\n    }\n}\n"

    "Order": {
      "file": "services/orders/orders/src/main/java/dev/orders/order/Order.java",
      "text": "package dev.orders.order;\n\nimport dev.blueprint.api.AggregateRoot;\nimport dev.orders.customer.Customer;\nimport java.time.Clock;\nimport java.time.Instant;\nimport java.util.List;\n\npublic final class Order extends AggregateRoot {\n\n    private OrderId id;\n    private String customer;\n    private List<Line> lines;\n    private long total;\n    private Status status;\n    private boolean paid;\n    private boolean reserved;\n    private Instant placedAt;\n\n    private Order() {\n    }\n\n    public static Order place(String customer, List<Line> lines, Clock clock) {\n        if (lines == null || lines.isEmpty()) {\n            throw new OrderError.Empty();\n        }\n        var order = new Order();\n        order.id = OrderId.next();\n        order.customer = customer;\n        order.lines = List.copyOf(lines);\n        order.total = order.lines.stream().mapToLong(Line::subtotal).sum();\n        order.status = Status.PLACED;\n        order.placedAt = clock.instant();\n        order.record(new OrderEvent.Placed(order.id, order.customer, order.lines, order.total, order.placedAt));\n        return order;\n    }\n\n    public static Order placeFor(Customer customer, List<Line> lines, Clock clock) {\n        customer.ensureCanOrder();\n        return place(customer.id().value(), lines, clock);\n    }\n\n    public void cancel(String reason) {\n        if (status != Status.PLACED) {\n            throw new OrderError.NotCancellable(id, status);\n        }\n        status = Status.CANCELLED;\n        record(new OrderEvent.Cancelled(id, reason));\n    }\n\n    public void markPaid() {\n        paid = true;\n        confirmWhenReady();\n    }\n\n    public void markReserved() {\n        reserved = true;\n        confirmWhenReady();\n    }\n\n    public void markDeclined() {\n        reject(\"payment declined\");\n    }\n\n    public void markOutOfStock() {\n        reject(\"out of stock\");\n    }\n\n    public void expireIfPlacedBefore(Instant cutoff) {\n        if (status == Status.PLACED && placedAt.isBefore(cutoff)) {\n            reject(\"expired\");\n        }\n    }\n\n    private void confirmWhenReady() {\n        if (status == Status.PLACED && paid && reserved) {\n            status = Status.CONFIRMED;\n            record(new OrderEvent.Confirmed(id));\n        }\n    }\n\n    private void reject(String reason) {\n        if (status == Status.PLACED) {\n            status = Status.REJECTED;\n            record(new OrderEvent.Rejected(id, reason));\n        }\n    }\n\n    public OrderId id() {\n        return id;\n    }\n\n    public String customer() {\n        return customer;\n    }\n\n    public List<Line> lines() {\n        return lines;\n    }\n\n    public long total() {\n        return total;\n    }\n\n    public Status status() {\n        return status;\n    }\n}\n"
    },

      "text": "package dev.orders.order;\n\nimport dev.blueprint.runtime.Http;\nimport dev.blueprint.runtime.HttpEntrypoint;\nimport dev.blueprint.runtime.ServiceRuntime;\nimport java.util.List;\nimport java.util.Map;\n\npublic final class OrderImportResource implements HttpEntrypoint {\n\n    private final OrderRepository orderRepository;\n    private final ServiceRuntime runtime;\n\n    public OrderImportResource(OrderRepository orderRepository, ServiceRuntime runtime) {\n        this.orderRepository = orderRepository;\n        this.runtime = runtime;\n    }\n\n    @Override\n    public void bind(Http http) {\n        http.post(\"/orders/import\", request -> {\n            request.caller().require(\"orders:create\");\n            var customer = request.param(\"customer\") != null ? request.param(\"customer\") : \"import\";\n            var ids = runtime.tx(() -> request.body().lines()\n                    .skip(1)\n                    .filter(line -> !line.isBlank())\n                    .map(line -> {\n                        var order = Order.place(customer, List.of(line(line)), runtime.clock());\n                        orderRepository.insert(order);\n                        return order.id().value();\n                    })\n                    .toList());\n            return Map.of(\"imported\", ids.size(), \"ids\", ids);\n        });\n    }\n\n    private static Line line(String csv) {\n        var cells = csv.split(\",\");\n        return new Line(cells[0].trim(), Integer.parseInt(cells[1].trim()), Long.parseLong(cells[2].trim()));\n    }\n}\n"
    },

      "text": "package dev.blueprint.api;\n\nimport java.util.Optional;\n\npublic interface Repository<A extends AggregateRoot, ID> {\n\n    A load(ID id);\n\n    Optional<A> find(ID id);\n\n    void insert(A aggregate);\n\n    void save(A aggregate);\n}\n"

    "MemoryRepository": {
      "file": "framework/blueprint-runtime/src/main/java/dev/blueprint/runtime/MemoryRepository.java",
      "text": "package dev.blueprint.runtime;\n\nimport dev.blueprint.api.AggregateRoot;\nimport dev.blueprint.api.Repository;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.function.Function;\n\npublic final class MemoryRepository<A extends AggregateRoot, ID> implements Repository<A, ID> {\n\n    private record Row(String json, long version) {\n    }\n\n    private final ServiceRuntime runtime;\n    private final Class<A> type;\n    private final Function<A, ID> identity;\n    private final Map<Object, Row> rows = new ConcurrentHashMap<>();\n\n    MemoryRepository(ServiceRuntime runtime, Class<A> type, Function<A, ID> identity) {\n        this.runtime = runtime;\n        this.type = type;\n        this.identity = identity;\n    }\n\n    @Override\n    public A load(ID id) {\n        return find(id).orElseThrow(() -> new NotFound(type.getSimpleName() + \" \" + id + \" not found\"));\n    }\n\n    @Override\n    public Optional<A> find(ID id) {\n        var tx = Tx.current(runtime);\n        var staged = tx.staged(this, id);\n        if (staged != null) {\n            return Optional.of(Json.read(staged.json(), type));\n        }\n        var row = rows.get(id);\n        if (row == null) {\n            return Optional.empty();\n        }\n        tx.read(this, id, row.version());\n        return Optional.of(Json.read(row.json(), type));\n    }\n\n    @Override\n    public void insert(A aggregate) {\n        stage(aggregate, true);\n    }\n\n    @Override\n    public void save(A aggregate) {\n        stage(aggregate, false);\n    }\n\n    private void stage(A aggregate, boolean insert) {\n        var tx = Tx.current(runtime);\n        var id = identity.apply(aggregate);\n        var previous = tx.staged(this, id);\n        var asInsert = insert || (previous != null && previous.insert());\n        if (!asInsert && tx.readVersion(this, id) == null) {\n            throw new IllegalStateException(\"save without load: \" + type.getSimpleName() + \" \" + id);\n        }\n        tx.write(this, id, new Tx.Write(Json.write(aggregate), asInsert));\n        tx.events.addAll(aggregate.pullEvents());\n    }\n\n    List<String> rows() {\n        return rows.values().stream().map(Row::json).toList();\n    }\n\n    void check(Object id, Tx.Write write, Long readVersion) {\n        var row = rows.get(id);\n        if (write.insert() && row != null) {\n            throw new Conflict(type.getSimpleName() + \" \" + id + \" already exists\");\n        }\n        if (!write.insert() && (row == null || row.version() != readVersion)) {\n            throw new Conflict(type.getSimpleName() + \" \" + id + \" changed concurrently\");\n        }\n    }\n\n    void apply(Object id, Tx.Write write) {\n        var row = rows.get(id);\n        rows.put(id, new Row(write.json(), row == null ? 1 : row.version() + 1));\n    }\n}\n"
    }

          "why": "Customer.register accepts any name, and the non-blank rule exists only as @NotBlank on RegisterCustomer.Input. Any other caller of register can create a nameless customer, unlike Order and Line, which enforce their invariants inside the domain.",
          "suggestion": "Reject a null or blank name inside Customer.register with a CustomerError, or introduce a CustomerName value object.",
          "member": "register",

          "file": "services/orders/orders/src/main/java/dev/orders/customer/Customer.java"
        },
        {
          "criterion": "Boundary",
          "severity": "Medium",
          "type": "Customer",
          "title": "Block Reason Is Not Validated by the Aggregate",
          "why": "Customer.block stores any reason, including null or blank, because the non-blank rule sits only on BlockCustomer.Input. The aggregate can therefore be left blocked with no meaningful reason.",
          "suggestion": "Validate the reason inside Customer.block and raise a domain error when it is blank.",
          "member": "block",
          "line": 25,
          "file": "services/orders/orders/src/main/java/dev/orders/customer/Customer.java"
        },
        {
          "criterion": "Consistency",
          "severity": "Low",
          "type": "CountConfirmedOrder",
          "title": "Missing Customer Silently Ignored Unlike Other Use Cases",
          "why": "Every other use case uses repository.load, which fails for an unknown id, while this one uses find().ifPresent and silently drops the event. A confirmed order with no matching customer goes unnoticed and the counter stays wrong.",
          "suggestion": "Use customerRepository.load like the other event handlers, or make the skip an explicit, documented decision.",
          "member": "execute",

      "text": "package dev.payments.app;\n\nimport dev.blueprint.runtime.Broker;\nimport dev.blueprint.runtime.Http;\nimport dev.blueprint.runtime.ServiceRuntime;\nimport dev.payments.app.adapters.FakePaymentGateway;\nimport dev.payments.app.generated.PaymentsModule;\nimport java.time.Clock;\n\npublic final class PaymentsApp {\n\n    public static final long LIMIT = 100_000;\n\n    private PaymentsApp() {\n    }\n\n    public static Http start(Broker broker, int port) {\n        return start(new ServiceRuntime(\"payments\", broker, Clock.systemUTC()), port);\n    }\n\n    public static Http start(ServiceRuntime runtime, int port) {\n        var http = new Http(port);\n        new PaymentsModule(runtime, new FakePaymentGateway(LIMIT)).bind(http);\n        http.start();\n        return http;\n    }\n}\n"
    },
    "FakePaymentGateway": {
      "file": "services/payments/app/src/main/java/dev/payments/app/adapters/FakePaymentGateway.java",
      "text": "package dev.payments.app.adapters;\n\nimport dev.payments.payment.PaymentGateway;\n\npublic final class FakePaymentGateway implements PaymentGateway {\n\n    private final long limit;\n\n    public FakePaymentGateway(long limit) {\n        this.limit = limit;\n    }\n\n    @Override\n    public boolean charge(String customer, long amount) {\n        return amount <= limit;\n    }\n}\n"
    },
    "PaymentsBlueprint": {
      "file": "services/payments/payments/src/main/java/dev/payments/PaymentsBlueprint.java",
      "text": "package dev.payments;\n\nimport dev.blueprint.dsl.Aggregate;\nimport dev.blueprint.dsl.Blueprint;\nimport dev.orders.contracts.OrderPlaced;\nimport dev.payments.contracts.PaymentConfirmed;\nimport dev.payments.contracts.PaymentDeclined;\nimport dev.payments.payment.ChargeOrder;\nimport dev.payments.payment.GetPayment;\nimport dev.payments.payment.Payment;\nimport dev.payments.payment.PaymentEvent;\n\npublic final class PaymentsBlueprint extends Blueprint {{\n\n    aggregate(new Aggregate<Payment>() {{\n        path(\"/payments\");\n\n        endpoints(\n            get(\"/{id}\").to(GetPayment.class)\n        );\n\n        policies(\n            authorize(GetPayment.class).permitAll()\n        );\n\n        events(\n            publish(PaymentConfirmed.class).from(PaymentEvent.Confirmed.class),\n            publish(PaymentDeclined.class).from(PaymentEvent.Declined.class),\n            on(OrderPlaced.class).to(ChargeOrder.class)\n        );\n    }});\n}}\n"
    },
    "ChargeOrder": {
      "file": "services/payments/payments/src/main/java/dev/payments/payment/ChargeOrder.java",
      "text": "package dev.payments.payment;\n\nimport dev.blueprint.api.UseCase;\nimport dev.orders.contracts.OrderPlaced;\n\npublic final class ChargeOrder implements UseCase {\n\n    private final PaymentRepository paymentRepository;\n    private final PaymentGateway gateway;\n\n    public ChargeOrder(PaymentRepository paymentRepository, PaymentGateway gateway) {\n        this.paymentRepository = paymentRepository;\n        this.gateway = gateway;\n    }\n\n    public void execute(OrderPlaced event) {\n        if (paymentRepository.find(new PaymentId(event.orderId())).isPresent()) {\n            return;\n        }\n        var approved = gateway.charge(event.customer(), event.total());\n        paymentRepository.insert(Payment.settle(event.orderId(), event.total(), approved));\n    }\n}\n"
    },
    "GetPayment": {
      "file": "services/payments/payments/src/main/java/dev/payments/payment/GetPayment.java",
      "text": "package dev.payments.payment;\n\nimport dev.blueprint.api.UseCase;\n\npublic final class GetPayment implements UseCase {\n\n    public record Input(PaymentId payment) {\n    }\n\n    public record Output(String id, String orderId, long amount, boolean approved) {\n    }\n\n    private final PaymentRepository paymentRepository;\n\n    public GetPayment(PaymentRepository paymentRepository) {\n        this.paymentRepository = paymentRepository;\n    }\n\n    public Output execute(Input input) {\n        var payment = paymentRepository.load(input.payment());\n        return new Output(payment.id().value(), payment.orderId(), payment.amount(), payment.approved());\n    }\n}\n"
    },
    "Payment": {
      "file": "services/payments/payments/src/main/java/dev/payments/payment/Payment.java",
      "text": "package dev.payments.payment;\n\nimport dev.blueprint.api.AggregateRoot;\n\npublic final class Payment extends AggregateRoot {\n\n    private PaymentId id;\n    private String orderId;\n    private long amount;\n    private boolean approved;\n\n    private Payment() {\n    }\n\n    public static Payment settle(String orderId, long amount, boolean approved) {\n        var payment = new Payment();\n        payment.id = new PaymentId(orderId);\n        payment.orderId = orderId;\n        payment.amount = amount;\n        payment.approved = approved;\n        payment.record(approved\n                ? new PaymentEvent.Confirmed(orderId, payment.id, amount)\n                : new PaymentEvent.Declined(orderId, \"limit exceeded\"));\n        return payment;\n    }\n\n    public PaymentId id() {\n        return id;\n    }\n\n    public String orderId() {\n        return orderId;\n    }\n\n    public long amount() {\n        return amount;\n    }\n\n    public boolean approved() {\n        return approved;\n    }\n}\n"
    },

      "text": "package dev.payments.payment;\n\nimport dev.blueprint.api.DomainEvent;\n\npublic sealed interface PaymentEvent extends DomainEvent {\n\n    record Confirmed(String orderId, PaymentId paymentId, long amount) implements PaymentEvent {\n    }\n\n    record Declined(String orderId, String reason) implements PaymentEvent {\n    }\n}\n"

      "text": "package dev.blueprint.runtime;\n\nimport dev.blueprint.api.AggregateRoot;\nimport dev.blueprint.api.Repository;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.function.Function;\n\npublic final class MemoryRepository<A extends AggregateRoot, ID> implements Repository<A, ID> {\n\n    private record Row(String json, long version) {\n    }\n\n    private final ServiceRuntime runtime;\n    private final Class<A> type;\n    private final Function<A, ID> identity;\n    private final Map<Object, Row> rows = new ConcurrentHashMap<>();\n\n    MemoryRepository(ServiceRuntime runtime, Class<A> type, Function<A, ID> identity) {\n        this.runtime = runtime;\n        this.type = type;\n        this.identity = identity;\n    }\n\n    @Override\n    public A load(ID id) {\n        return find(id).orElseThrow(() -> new NotFound(type.getSimpleName() + \" \" + id + \" not found\"));\n    }\n\n    @Override\n    public Optional<A> find(ID id) {\n        var tx = Tx.current(runtime);\n        var staged = tx.staged(this, id);\n        if (staged != null) {\n            return Optional.of(Json.read(staged.json(), type));\n        }\n        var row = rows.get(id);\n        if (row == null) {\n            return Optional.empty();\n        }\n        tx.read(this, id, row.version());\n        return Optional.of(Json.read(row.json(), type));\n    }\n\n    @Override\n    public void insert(A aggregate) {\n        stage(aggregate, true);\n    }\n\n    @Override\n    public void save(A aggregate) {\n        stage(aggregate, false);\n    }\n\n    private void stage(A aggregate, boolean insert) {\n        var tx = Tx.current(runtime);\n        var id = identity.apply(aggregate);\n        var previous = tx.staged(this, id);\n        var asInsert = insert || (previous != null && previous.insert());\n        if (!asInsert && tx.readVersion(this, id) == null) {\n            throw new IllegalStateException(\"save without load: \" + type.getSimpleName() + \" \" + id);\n        }\n        tx.write(this, id, new Tx.Write(Json.write(aggregate), asInsert));\n        tx.events.addAll(aggregate.pullEvents());\n    }\n\n    List<String> rows() {\n        return rows.values().stream().map(Row::json).toList();\n    }\n\n    void check(Object id, Tx.Write write, Long readVersion) {\n        var row = rows.get(id);\n        if (write.insert() && row != null) {\n            throw new Conflict(type.getSimpleName() + \" \" + id + \" already exists\");\n        }\n        if (!write.insert() && (row == null || row.version() != readVersion)) {\n            throw new Conflict(type.getSimpleName() + \" \" + id + \" changed concurrently\");\n        }\n    }\n\n    void apply(Object id, Tx.Write write) {\n        var row = rows.get(id);\n        rows.put(id, new Row(write.json(), row == null ? 1 : row.version() + 1));\n    }\n}\n"

let redraw = () => {};
let keys = () => {};
let refocus = () => {};
let boardFilter = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function svg(tag, attrs) {
  const node = document.createElementNS(SVG, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function title(text) {
  if (text === EXTERNAL) return 'Outside System';
  if (text.startsWith('external:')) return text.slice('external:'.length);
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function plural(n, word) {
  if (n === 1) return word;
  return /[^aeiou]y$/.test(word) ? word.slice(0, -1) + 'ies' : word + 's';
}

function amount(n, word) {
  return n + ' ' + plural(n, word);
}

function icon(kind, letter) {
  return el('span', 'icon i-' + kind, letter);
}

function glyph(kind) {
  const node = svg('svg', { viewBox: '0 0 16 16', class: 'glyph', 'aria-hidden': 'true' });
  if (kind === 'system') {
    node.append(svg('circle', { cx: 8, cy: 3.5, r: 2, fill: 'currentColor' }),
      svg('circle', { cx: 3, cy: 12, r: 2, fill: 'currentColor' }),
      svg('circle', { cx: 13, cy: 12, r: 2, fill: 'currentColor' }),
      svg('path', { d: 'M8 5.5 L3.8 10.3 M8 5.5 L12.2 10.3 M5 12 H11', stroke: 'currentColor', 'stroke-width': 1.3, fill: 'none' }));
  } else if (kind === 'flow') {
    node.append(svg('circle', { cx: 3, cy: 4, r: 1.8, fill: 'currentColor' }), svg('circle', { cx: 13, cy: 12, r: 1.8, fill: 'currentColor' }),
      svg('path', { d: 'M4.8 4 C 9 4, 7 12, 11.2 12', stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none' }),
      svg('path', { d: 'M4.8 6.5 C 9 6.5, 7 9.5, 11.2 9.5', stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none', opacity: .55 }));
  } else if (kind === 'api' || kind === 'calls') {
    node.append(svg('path', { d: 'M5.5 4 L2 8 L5.5 12 M10.5 4 L14 8 L10.5 12', stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  } else if (kind === 'crit-boundary') {
    node.append(svg('rect', { x: 2.5, y: 3.5, width: 11, height: 9, rx: 1.5, stroke: 'currentColor', 'stroke-width': 1.2, fill: 'none' }),
      svg('path', { d: 'M8 1.5 V14.5', stroke: 'currentColor', 'stroke-width': 1.3, 'stroke-dasharray': '1.6 1.6', fill: 'none' }));
  } else if (kind === 'crit-modeling') {
    node.append(svg('path', { d: 'M8 2 L13.5 5 V11 L8 14 L2.5 11 V5 Z M2.5 5 L8 8 L13.5 5 M8 8 V14', stroke: 'currentColor', 'stroke-width': 1.2, fill: 'none', 'stroke-linejoin': 'round' }));
  } else if (kind === 'crit-consistency') {
    node.append(svg('path', { d: 'M3 5.5 H13 M3 10.5 H13 M5.5 3 V8 M10.5 8 V13', stroke: 'currentColor', 'stroke-width': 1.3, fill: 'none', 'stroke-linecap': 'round' }));
  } else if (kind === 'crit-naming') {
    node.append(svg('path', { d: 'M2.5 3.5 H8.5 L13.5 8 L8.5 12.5 H2.5 Z', stroke: 'currentColor', 'stroke-width': 1.2, fill: 'none', 'stroke-linejoin': 'round' }),
      svg('circle', { cx: 5.5, cy: 8, r: 1.1, fill: 'currentColor' }));
  } else if (kind === 'crit-complexity') {
    node.append(svg('path', { d: 'M4 2.5 V13.5 M4 6 C 4 8, 12 7, 12 10 V13.5 M4 9.5 C 4 11, 8 11, 8 12.5 V13.5', stroke: 'currentColor', 'stroke-width': 1.2, fill: 'none', 'stroke-linecap': 'round' }),
      svg('circle', { cx: 4, cy: 2.5, r: 1.2, fill: 'currentColor' }));
  } else if (kind === 'review') {
    node.append(svg('circle', { cx: 7, cy: 7, r: 4.5, stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none' }),
      svg('path', { d: 'M10.4 10.4 L14 14 M5 7 L6.6 8.6 L9.2 5.6', stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  } else if (kind === 'contracts') {
    node.append(svg('path', { d: 'M4 2 H9.5 L12.5 5 V14 H4 Z M9.5 2 V5 H12.5 M6 8 H10.5 M6 10.5 H10.5', stroke: 'currentColor', 'stroke-width': 1.3, fill: 'none', 'stroke-linejoin': 'round' }));

  } else if (kind === 'external') {
    node.append(svg('circle', { cx: 8, cy: 8, r: 6, stroke: 'currentColor', 'stroke-width': 1.3, fill: 'none', 'stroke-dasharray': '2.5 2' }));
  } else {
    node.append(svg('rect', { x: 2, y: 2, width: 12, height: 12, rx: 3, stroke: 'currentColor', 'stroke-width': 1.3, fill: 'none' }),

const PALETTE = ['var(--icon-blue)', 'var(--icon-orange)', 'var(--icon-purple)', 'var(--icon-teal)', 'var(--icon-green)', 'var(--red)'];
const STACKS = {
  java: { code: 'J', color: '#E76F00' },
  quarkus: { code: 'Q', color: '#4695EB' },
  python: { code: 'Py', color: '#3776AB' },
  go: { code: 'Go', color: '#00ADD8' },
  node: { code: 'JS', color: '#C9A800' },
  typescript: { code: 'TS', color: '#3178C6' },
  kotlin: { code: 'K', color: '#7F52FF' },
  rust: { code: 'Rs', color: '#B7410E' },
  dotnet: { code: 'C#', color: '#512BD4' },
  hardware: { code: 'HW', color: '#6F737A' }
};

function entryColor(entry) {
  return entry.kind === 'event' ? 'var(--icon-gray)' : entry.kind === 'schedule' ? 'var(--schedule)' : serviceColor(entry.service);
}

function serviceColor(name) {
  if (name === EXTERNAL || name.startsWith('external:')) return 'var(--icon-gray)';
  const i = services.map(s => s.service).sort().indexOf(name);
  return PALETTE[Math.max(0, i) % PALETTE.length];
}

function stackOf(name) {
  if (name.startsWith('external:')) {
    const system = index.externals.get(name);
    return system && system.kind ? [system.kind] : [];
  }
  const service = services.find(s => s.service === name);
  return service && service.stack ? service.stack : [];
}

function stackBadges(name) {
  return stackOf(name).map(entry => {
    const key = entry.toLowerCase().replace(/[^a-z#]/g, '');
    const known = STACKS[key];
    if (LOGOS[key]) {
      const logo = el('span', 'stack-logo');
      logo.style.setProperty('--logo', 'url("' + LOGOS[key] + '")');
      logo.title = entry;
      logo.setAttribute('role', 'img');
      logo.setAttribute('aria-label', entry);
      return logo;
    }
    const badge = el('span', 'stack', known ? known.code : entry.slice(0, 2));
    badge.title = entry;
    if (known) badge.style.background = known.color;
    return badge;
  });
}

function serviceMeta(name) {
  const service = services.find(s => s.service === name);
  if (!service) return null;
  return amount(service.aggregates.length, 'Aggregate') + ', ' + amount(count(service.aggregates, a => a.endpoints), 'Endpoint');
}

function svc(name) {
  return name === EXTERNAL || name.startsWith('external:') ? title(name) : title(name) + ' Service';
}

function to(view, key) {
  return 'system/' + view + '/' + encodeURIComponent(key);
}

function contractOf(service, domainEvent) {
  const s = services.find(x => x.service === service);
  const p = s && s.aggregates.flatMap(a => a.publishes).find(x => x.from === domainEvent);
  return p ? p.contract : null;
}

function depInfo(service, dep) {
  const s = services.find(x => x.service === service);
  return (s && s.dependencies && s.dependencies[dep]) || null;
}

function signatureLabel(m) {
  const node = el('span', 'code');
  node.append(el('span', 'name', m.name), document.createTextNode('(' + m.params.join(', ') + ')'));
  if (m.returns && m.returns !== 'void') node.append(el('span', 'muted', ' → ' + m.returns));
  return node;
}

function depCard(id, service, dep, called) {
  const info = depInfo(service, dep);
  const kind = depKind(dep);
  const methods = info ? info.methods : [];
  const rows = methods.filter(m => !called || called.has(m.name)).map(m => ({ id: 'm:' + m.name, label: signatureLabel(m), code: false,
    ports: { in: true }, muted: false, source: methodSources(service, dep, m.name), inspectTitle: m.name + '(' + m.params.join(', ') + ')' }));
  return { id, group: service + '|' + dep, glyph: 'dependencies', title: dep, titleCode: true,
    meta: kind + (info && info.aggregate ? ' For ' + info.aggregate : '') + ', ' + svc(service),
    tag: kind, badges: [], color: serviceColor(service), ports: { in: true, out: kind !== 'Platform' }, rows, fixedRows: true,
    href: to('dependencies', service + '|' + dep), source: typeSources(service, dep) };
}

function infraCard(id, service, dep) {
  const infra = (services.find(x => x.service === service) || {});
  if (depKind(dep) === 'Repository') return { id, glyph: 'database', title: infra.store || 'Store', meta: 'Store, ' + svc(service), href: to('dependencies', service + '|' + dep),
    source: [{ service, type: repositoryImplementation(service) }] };
  const adapters = (infra.adapters || {})[dep] || [];
  return adapters.length
    ? { id, glyph: 'adapter', title: adapters.join(', '), titleCode: true, meta: 'Adapter For ' + dep, href: to('dependencies', service + '|' + dep), source: adapters.map(type => ({ service, type })) }
    : { id, glyph: 'adapter', title: 'No Adapter Found', meta: dep, dashed: true, href: to('dependencies', service + '|' + dep) };
}

function serviceCard(name, side, rows, extra) {
  const external = name === EXTERNAL || name.startsWith('external:');
  const system = index.externals.get(name);
  return {
    id: side + ':' + name,
    group: name,
    glyph: external ? 'external' : 'service',
    title: title(name),
    kind: system && system.kind ? system.kind : null,
    tag: name === EXTERNAL ? 'Undeclared' : external ? 'External' : 'Service',
    badges: stackBadges(name),
    meta: name === EXTERNAL ? (side === 'from' || side === 'entries' ? 'No Declared Publisher' : 'No Declared Consumer') : external ? null : serviceMeta(name),
    dashed: external,
    color: serviceColor(name),
    href: external ? to('flow', name) : 'service/' + name,
    service: external ? null : name,
    rows,
    ...(extra || {})
  };
}

function board(view, spec) {
  const columns = spec.columns.filter(c => c.cards.length);
  const CARD = spec.cardWidth || 292;
  const GAP = spec.gap || (columns.length <= 2 ? 620 : columns.length === 3 ? 300 : 220);
  const MAX_CARD = 460;
  const width = columns.length * CARD + (columns.length - 1) * GAP;
  const { canvas, world, layer, fit, centerOn, touched } = canvasOn(view, spec.glyph, spec.label, width, spec.inset || 0, spec.tabs || null);
  let pinned = null;
  const cards = new Map();
  const rows = new Map();
  const links = spec.links;

  const labels = columns.map(column => {
    const label = el('div', 'flow-label', column.label || '');
    world.append(label);
    return label;
  });

  const port = (side, color) => {
    const dot = el('span', 'port ' + side);
    dot.style.setProperty('--port', color || 'var(--wire)');
    return dot;
  };

  columns.forEach((column, ci) => column.cards.forEach(card => {
    const node = el(card.via ? 'div' : 'button', 'card' + (card.dashed ? ' external' : '') + (card.rows && card.rows.length ? '' : ' simple') + (card.via ? ' via' : ''));
    const navigate = card.onClick || (card.href ? () => go(card.href) : null);
    node.type = 'button';
    node.addEventListener('click', () => inspect(canvas, { node,
      title: card.title, kind: [card.kind ? card.kind : null, card.meta].filter(Boolean).join(', ') || card.tag,
      tags: card.inspectTags, terms: card.terms, classes: card.classes, source: card.source, snippets: card.snippets, service: card.service, open: navigate, openLabel: card.openLabel }));
    if (navigate) node.addEventListener('dblclick', event => { event.stopPropagation(); navigate(); });
    node.dataset.id = card.id;
    const head = el('span', 'card-title');
    head.append(card.glyph === 'usecase' ? icon('usecase', 'U') : card.glyph === 'domain' ? icon('domain', 'D') : card.glyph === 'aggregate' ? icon('aggregate', 'A') : glyph(card.glyph || 'service'));
    head.append(el('span', 'card-name' + (card.titleCode ? ' code' : ''), card.title));
    if (card.kind) head.append(el('span', 'card-kind', '(' + card.kind + ')'));
    const right = el('span', 'card-right');
    (card.badges || []).forEach(b => right.append(b));
    if (card.tag) right.append(el('span', 'tag', card.tag));
    if (right.children.length) head.append(right);
    if (card.ports && card.ports.in) head.append(port('in', card.inColor || card.color));
    if (card.ports && card.ports.out) head.append(port('out', card.color));
    node.append(head);
    if (card.meta) node.append(el('span', 'card-meta', card.meta));
    if (card.rows && card.rows.length) {
      const list = el('span', 'ports');
      const sectionLabels = new Map();
      card.rows.forEach(row => {
        if (row.section && !sectionLabels.has(row.section)) {
          const label = el('span', 'port-section', row.section);
          label.dataset.section = row.section;
          sectionLabels.set(row.section, label);
          list.append(label);
        }
        const line = el('span', 'port-row' + (row.wrap ? ' wrap' : '') + (row.ports && row.ports.out && !(row.ports.in) && !row.alignLeft ? ' to-right' : ''));
        line.dataset.row = row.id;
        if (row.indent) line.style.paddingLeft = (6 + row.indent * 16) + 'px';
        if (row.ports && row.ports.in) line.append(port('in', row.inColor || row.color));
        if (row.lead) line.append(row.lead);
        const text = el('span', 'port-label' + (row.code === false ? ' plain' : '') + (row.strong ? ' strong' : '') + (row.muted ? ' dropped' : '') + (row.dim ? ' dimmed' : ''));
        if (typeof row.label === 'string') text.textContent = row.label; else text.append(row.label);
        line.append(text);
        if (row.note) line.append(el('span', 'port-note', row.note));
        if (row.tag) {
          const tags = el('span', 'port-tags');
          (Array.isArray(row.tag) ? row.tag : [row.tag]).forEach(t => tags.append(t));
          line.append(tags);
        }
        if (row.ports && row.ports.out) line.append(port('out', row.color));
        if (row.sub && row.sub.length) {
          line.classList.add('has-sub');
          const sub = el('span', 'port-sub' + (row.subUnder ? ' under-' + row.subUnder : ''));
          row.sub.forEach((t, i) => {
            const item = el('span', 'annot-line' + (i < row.sub.length - 1 ? ' more' : ''));
            item.append(el('span', 'elbow'), t);
            sub.append(item);
          });
          line.append(sub);
        }
        const rowNavigate = row.onClick || (row.href ? () => go(row.href) : null);
        line.classList.add('clickable');
        line.addEventListener('click', event => {
          event.stopPropagation();
          const text = line.querySelector('.port-label').textContent;
          inspect(canvas, { node: line, title: row.inspectTitle || text, kind: card.title, tags: row.inspectTags, terms: row.terms || (row.source || row.snippets ? [] : classTokens(text)), source: row.source, snippets: row.snippets,
            classes: row.classes, service: card.service, open: rowNavigate, openLabel: row.openLabel });
        });
        if (rowNavigate) line.addEventListener('dblclick', event => { event.stopPropagation(); rowNavigate(); });
        line.addEventListener('mouseenter', event => { event.stopPropagation(); focus({ card: card.id, row: row.id }); });
        line.addEventListener('mouseleave', () => focus({ card: card.id }));
        list.append(line);
        rows.set(card.id + '|' + row.id, { line, row, card });
      });
      node.append(list);
    }
    node.addEventListener('mouseenter', () => focus({ card: card.id }));
    node.addEventListener('mouseleave', () => focus(pinned));
    world.append(node);
    cards.set(card.id, { node, card, column: ci });
  }));

  const KINDS = [['flow', 'Triggers'], ['reaction', 'In-Process Reaction'], ['calls', 'Calls'], ['backed', 'Backed By'], ['mapping', 'Field Mapping'], ['snapshot', 'Starts From']];
  const present = new Set(links.map(l => l.kind || 'flow'));
  const legend = el('div', 'canvas-legend');
  KINDS.filter(([k]) => present.has(k)).forEach(([k, label]) => {
    const item = el('span', 'legend-item');
    const sample = svg('svg', { width: 28, height: 8, class: 'k-' + k });
    sample.append(svg('path', { d: 'M 1 4 L 27 4', class: 'core' }));
    item.append(sample, el('span', null, label));
    legend.append(item);
  });
  if (present.size) canvas.append(legend);
  const endpoint = ([cardId, rowId]) => rowId ? rows.get(cardId + '|' + rowId) : null;
  const valid = links.filter(l => cards.has(l.from[0]) && cards.has(l.to[0]) && (!l.from[1] || endpoint(l.from)) && (!l.to[1] || endpoint(l.to)));
  const portOf = ([cardId, rowId], side) => {
    const holder = rowId ? rows.get(cardId + '|' + rowId).line : cards.get(cardId).node.querySelector('.card-title');
    return holder.querySelector(':scope > .port.' + side);
  };
  world.querySelectorAll('.port').forEach(dot => dot.classList.add('unused'));
  valid.forEach(link => {
    [[link.from, 'out'], [link.to, 'in']].forEach(([end, side]) => {
      const used = portOf(end, side);
      if (used) used.classList.remove('unused');
      const dot = portOf(end, side);
      if (dot && !dot.dataset.painted) {
        dot.style.setProperty('--port', ['calls', 'backed'].includes(link.kind) ? 'var(--icon-gray)' : link.color || 'var(--wire)');
        dot.dataset.painted = 'true';
      }
    });
  });

  function touching(link, target) {
    if (target.row) {
      const key = target.card + '|' + target.row;
      const own = rows.get(key);
      return (link.from[0] + '|' + link.from[1]) === key || (link.to[0] + '|' + link.to[1]) === key
        || (own && own.row.group && link.group === own.row.group);
    }
    const group = cards.get(target.card).card.group;
    return [link.from[0], link.to[0]].some(id => id === target.card || (group && cards.get(id).card.group === group));
  }

  function closure(seed) {
    const keyOf = end => end[0] + '|' + (end[1] || '');
    const active = new Set(seed);
    const walk = (start, from, to) => {
      const seen = new Set(start);
      let frontier = [...seen];
      while (frontier.length) {
        const next = [];
        valid.forEach(link => {
          if (!frontier.includes(keyOf(from(link)))) return;
          active.add(link);
          const key = keyOf(to(link));
          if (!seen.has(key)) { seen.add(key); next.push(key); }
        });
        frontier = next;
      }
    };
    walk(seed.map(l => keyOf(l.to)), l => l.from, l => l.to);
    walk(seed.map(l => keyOf(l.from)), l => l.to, l => l.from);
    return [...active];
  }

  function focus(target) {
    refocus = () => focus(target);
    world.classList.toggle('focus', !!target);
    const active = target ? closure(valid.filter(l => touching(l, target))) : [];
    const lit = new Set(active);
    layer.querySelectorAll('g.cable').forEach(g => g.classList.toggle('lit', lit.has(valid[g.dataset.index])));
    layer.querySelectorAll('g.tie').forEach(g => {
      const on = (g.members || []).filter(m => lit.has(valid[m.i]));
      g.classList.toggle('lit', on.length > 0);
      sizeTie(g, on.length ? on : g.members);
    });
    const litCards = new Set(active.flatMap(l => [l.from[0], l.to[0]]));
    if (target && !target.row) {
      const group = cards.get(target.card).card.group;
      cards.forEach((c, id) => { if (id === target.card || (group && c.card.group === group)) litCards.add(id); });
    }
    if (target && target.row) litCards.add(target.card);
    cards.forEach((c, id) => c.node.classList.toggle('lit', litCards.has(id)));
    const litRows = new Set(active.flatMap(l => [l.from, l.to].filter(e => e[1]).map(e => e[0] + '|' + e[1])));
    if (target && target.row) litRows.add(target.card + '|' + target.row);
    rows.forEach((r, key) => {
      r.line.classList.toggle('lit', litRows.has(key));
      r.line.classList.toggle('single', !!(target && target.row) && litRows.has(key));
    });
  }

  function place(node) {
    let x = 0, y = 0;
    for (let n = node; n && n !== world; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
    return { x, y, w: node.offsetWidth, h: node.offsetHeight };
  }

  function anchor(end, side) {
    const [cardId, rowId] = end;
    const holder = rowId ? rows.get(cardId + '|' + rowId).line : cards.get(cardId).node.querySelector('.card-title');
    const dot = holder.querySelector(':scope > .port.' + side);
    if (dot) {
      const r = place(dot);
      return { x: side === 'out' ? r.x + r.w : r.x, y: r.y + r.h / 2 };
    }
    const c = place(cards.get(cardId).node);
    if (cards.get(cardId).card.via) return { x: side === 'out' ? c.x + c.w : c.x, y: c.y + c.h / 2 };
    const r = place(holder);
    return { x: side === 'out' ? c.x + c.w : c.x, y: r.y + Math.min(r.h / 2, 14) };
  }

  const bundleKey = l => l.from[0] + '>' + l.to[0];

  let widths = null;
  function measure() {
    cards.forEach(({ node }) => {
      const access = [...node.querySelectorAll('.port-tags > .tag-access')];
      const widest = Math.max(0, ...access.map(t => t.offsetWidth));
      access.forEach(t => { t.style.minWidth = widest + 'px'; });
    });
    widths = columns.map(column => {
      if (spec.fixedWidth) return CARD;
      const natural = column.cards.filter(card => !card.via).map(card => {
        const node = cards.get(card.id).node;
        node.style.width = 'max-content';
        return Math.ceil(node.offsetWidth) + 2;
      });
      return Math.min(MAX_CARD, Math.max(CARD, ...natural));
    });
  }

  function layout() {
    if (!widths) measure();
    const total = widths.reduce((a, b) => a + b, 0) + GAP * (columns.length - 1);
    world.style.width = total + 'px';
    const top = 32, gap = 20;
    let x = 0;
    columns.forEach((column, ci) => {
      labels[ci].style.left = x + 'px';
      column.cards.forEach(card => {
        const node = cards.get(card.id).node;
        node.style.width = widths[ci] + 'px';
        node.style.left = x + 'px';
      });
      x += widths[ci] + GAP;
    });
    const heights = columns.map(column => column.cards.reduce((sum, card) => sum + cards.get(card.id).node.offsetHeight, 0) + gap * (column.cards.length - 1));
    const tallest = Math.max(...heights);
    columns.forEach((column, ci) => {
      let y = top + (tallest - heights[ci]) / 2;
      column.cards.forEach(card => {
        const node = cards.get(card.id).node;
        node.style.top = y + 'px';
        y += node.offsetHeight + gap;
      });
    });
    world.style.height = (top + tallest + gap) + 'px';
    draw();
  }

  function arrange() {
    for (let pass = 0; pass < 3; pass++) {
      for (let ci = 1; ci < columns.length; ci++) {
        const column = columns[ci];
        const weight = card => {
          const ys = valid.filter(l => l.to[0] === card.id && cards.get(l.from[0]).column < ci).map(l => anchor(l.from, 'out').y);
          return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : Infinity;
        };
        if (!column.fixed) column.cards.sort((a, b) => weight(a) - weight(b));
        layout();
      }
      columns.forEach((column, ci) => column.cards.forEach(card => {
        if (card.fixedRows || !card.rows) return;
        const list = cards.get(card.id).node.querySelector('.ports');
        const other = row => {
          const ys = valid.filter(l => (l.from[0] === card.id && l.from[1] === row.id) || (l.to[0] === card.id && l.to[1] === row.id))
            .map(l => l.from[0] === card.id ? anchor(l.to, 'in').y : anchor(l.from, 'out').y);
          return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : Infinity;
        };
        const sections = [...new Set(card.rows.map(r => r.section || ''))];
        sections.forEach(section => {
          const label = section ? list.querySelector(':scope > .port-section[data-section="' + CSS.escape(section) + '"]') : null;
          if (label) list.append(label);
          card.rows.filter(r => (r.section || '') === section).sort((a, b) => other(a) - other(b))
            .forEach(r => list.append(rows.get(card.id + '|' + r.id).line));
        });
      }));
      layout();
    }
  }

  function tie(x, y, members) {
    const g = svg('g', { class: 'tie', transform: 'translate(' + x + ' ' + y + ')' });
    g.append(svg('rect', { x: -2, width: 4, rx: 1.5, class: 'tie-band' }), svg('rect', { x: 1.5, width: 3, height: 5, rx: 1, class: 'tie-head' }));
    g.members = members;
    sizeTie(g, members);
    layer.append(g);
  }

  function sizeTie(g, members) {
    const offsets = members.map(m => m.o);
    const low = Math.min(...offsets), high = Math.max(...offsets);
    const length = high - low + 6;
    const center = (low + high) / 2;
    g.children[0].setAttribute('y', center - length / 2);
    g.children[0].setAttribute('height', length);
    g.children[1].setAttribute('y', center - length / 2 + 1);
  }

  function draw() {
    columns.forEach((column, ci) => {
      const tops = column.cards.map(card => parseFloat(cards.get(card.id).node.style.top)).filter(v => !Number.isNaN(v));
      if (tops.length) labels[ci].style.top = Math.max(0, Math.min(...tops) - 28) + 'px';
    });
    layer.replaceChildren();
    const bundles = new Map();
    valid.forEach((l, i) => push(bundles, bundleKey(l), { l, i }));
    const spacing = 5;
    const converging = new Map();
    bundles.forEach((list, key) => {
      if (list.length === 1 && !cards.get(list[0].l.to[0]).card.via) push(converging, list[0].l.to[0], { ...list[0], key });
    });
    converging.forEach((list, target) => {
      if (list.length < 2) return;
      list.forEach(x => bundles.delete(x.key));
      const ends = list.map(x => ({ ...x, s: anchor(x.l.from, 'out'), e: anchor(x.l.to, 'in') })).sort((a, b) => a.e.y - b.e.y);
      const endX = Math.min(...ends.map(x => x.e.x));
      const startX = Math.max(...ends.map(x => x.s.x));
      const bx = endX - Math.min(90, (endX - startX) * 0.25);
      const cy = ends.reduce((a, x) => a + x.e.y, 0) / ends.length;
      const members = [];
      const gap = ends.length > 6 ? 3 : 4;
      const targets = [...new Set(ends.map(x => x.l.to.join('|')))];
      ends.forEach(({ l, i, s, e }) => {
        const o = (targets.indexOf(l.to.join('|')) - (targets.length - 1) / 2) * gap;
        members.push({ i, o });
        const bend = Math.max(40, (bx - s.x) / 2);
        const reach = Math.min(50, (e.x - bx) * 0.6);
        cable(l, i, 'M ' + s.x + ' ' + s.y + ' C ' + (s.x + bend) + ' ' + s.y + ', ' + (bx - bend) + ' ' + (cy + o) + ', ' + bx + ' ' + (cy + o)
          + ' C ' + (bx + reach) + ' ' + (cy + o) + ', ' + (e.x - reach) + ' ' + e.y + ', ' + e.x + ' ' + e.y);
      });
      tie(bx, cy, members);
    });
    const groups = [];
    bundles.forEach(list => {
      if (list.length === 1) {
        const { l, i } = list[0];
        const s = anchor(l.from, 'out'), e = anchor(l.to, 'in');
        const bend = Math.max(40, (e.x - s.x) / 2);
        cable(l, i, 'M ' + s.x + ' ' + s.y + ' C ' + (s.x + bend) + ' ' + s.y + ', ' + (e.x - bend) + ' ' + e.y + ', ' + e.x + ' ' + e.y);
        return;
      }
      const ends = list.map(x => ({ ...x, s: anchor(x.l.from, 'out'), e: anchor(x.l.to, 'in') })).sort((a, b) => a.s.y - b.s.y || a.e.y - b.e.y);
      const gap = ends.length > 6 ? 3 : 4;
      groups.push({ ends, gap, from: list[0].l.from[0], to: list[0].l.to[0], width: (ends.length - 1) * gap + 6,
        rawFrom: ends.reduce((a, x) => a + x.s.y, 0) / ends.length, rawTo: ends.reduce((a, x) => a + x.e.y, 0) / ends.length });
    });
    const lanes = (key, raw, order, set) => {
      const byCard = new Map();
      groups.forEach(g => push(byCard, g[key], g));
      byCard.forEach(list => {
        list.sort((x, y) => order(x) - order(y));
        const total = list.reduce((a, g) => a + g.width, 0) + 16 * (list.length - 1);
        const center = list.reduce((a, g) => a + raw(g), 0) / list.length;
        let y = center - total / 2;
        list.forEach((g, lane) => { set(g, y + g.width / 2, lane, list.length); y += g.width + 16; });
      });
    };
    lanes('from', g => g.rawFrom, g => g.rawTo, (g, y, lane, count) => { g.cy1 = y; g.shiftA = (lane - (count - 1) / 2) * 14; });
    lanes('to', g => g.rawTo, g => g.cy1, (g, y, lane, count) => { g.cy2 = y; g.shiftB = (lane - (count - 1) / 2) * 14; });
    groups.forEach(({ ends, cy1, cy2, gap, shiftA, shiftB }) => {
      const startX = Math.max(...ends.map(x => x.s.x)), endX = Math.min(...ends.map(x => x.e.x));
      const span = endX - startX;
      const ax = startX + span * 0.28 + shiftA, bx = startX + span * 0.72 + shiftB, mid = (ax + bx) / 2;
      const reach = Math.min(70, span * 0.12);
      const left = [];
      const right = [];
      const targets = [...new Set(ends.map(x => x.l.to.join('|')))]
        .sort((p, q) => ends.find(x => x.l.to.join('|') === p).e.y - ends.find(x => x.l.to.join('|') === q).e.y);
      const merged = targets.length < ends.length;
      ends.forEach(({ l, i, s, e }, n) => {
        const o = (n - (ends.length - 1) / 2) * gap;
        const t = targets.indexOf(l.to.join('|'));
        const r = (t - (targets.length - 1) / 2) * gap;
        left.push({ i, o });
        right.push({ i, o: r });
        cable(l, i, 'M ' + s.x + ' ' + s.y
          + ' C ' + (s.x + reach) + ' ' + s.y + ', ' + (ax - reach) + ' ' + (cy1 + o) + ', ' + ax + ' ' + (cy1 + o)
          + ' C ' + mid + ' ' + (cy1 + o) + ', ' + mid + ' ' + (cy2 + r) + ', ' + bx + ' ' + (cy2 + r)
          + ' C ' + (bx + reach) + ' ' + (cy2 + r) + ', ' + (e.x - reach) + ' ' + e.y + ', ' + e.x + ' ' + e.y, merged);
      });
      tie(ax, cy1, left);
      tie(bx, cy2, right);
    });
    cards.forEach(({ card, node }) => {
      if (!card.via) return;
      const incoming = valid.find(l => l.to[0] === card.id);
      if (!incoming) return;
      const c = place(node);
      const i = valid.indexOf(incoming);
      cable(incoming, i, 'M ' + c.x + ' ' + (c.y + c.h / 2) + ' L ' + (c.x + c.w) + ' ' + (c.y + c.h / 2));
    });
    layer.querySelectorAll('g.tie').forEach(t => layer.append(t));
    refocus();
  }

  function cable(link, i, d, merged) {
    const g = svg('g', { class: 'cable' });
    g.dataset.index = i;
    g.style.color = link.color || 'var(--wire)';
    const kind = link.kind || 'flow';
    g.classList.add('k-' + kind);
    if (kind === 'calls' || kind === 'backed') g.style.color = 'var(--icon-gray)';
    if (merged) g.classList.add('merged');
    g.append(svg('path', { d, class: 'glow' }), svg('path', { d, class: 'core' }));
    const hit = svg('path', { d, class: 'hit' });
    const target = link.from[1] ? { card: link.from[0], row: link.from[1] } : link.to[1] ? { card: link.to[0], row: link.to[1] } : { card: link.from[0] };
    hit.addEventListener('mouseenter', () => focus(target));
    hit.addEventListener('mouseleave', () => focus(pinned));
    if (link.title) {
      const label = svg('title');
      label.textContent = link.title;
      hit.append(label);
    }
    g.append(hit);
    layer.append(g);
  }

  let arranged = false;
  redraw = () => {
    if (!canvas.offsetParent) return;
    widths = null;
    layout();
    if (!arranged) {
      arranged = true;
      arrange();
      if (spec.focus && cards.has(spec.focus.card) && (!spec.focus.row || rows.has(spec.focus.card + '|' + spec.focus.row))) {
        pinned = spec.focus;
        const holder = spec.focus.row ? rows.get(spec.focus.card + '|' + spec.focus.row).line : cards.get(spec.focus.card).node;
        const r = place(holder);
        layout();
        centerOn(r.x + r.w / 2, r.y + r.h / 2);
        focus(pinned);
        return;
      }
    }
    if (!touched()) fit();
  };
  boardFilter = query => {
    world.classList.toggle('focus', query !== '');
    rows.forEach(r => r.line.classList.toggle('lit', query !== '' && r.line.textContent.toLowerCase().includes(query)));
    rows.forEach(r => r.line.classList.remove('single'));
    cards.forEach(c => c.node.classList.toggle('lit', query !== '' && c.node.textContent.toLowerCase().includes(query)));
    layer.querySelectorAll('g.cable').forEach(g => {
      const l = valid[g.dataset.index];
      const hit = [l.from, l.to].some(e => e[1] ? rows.get(e[0] + '|' + e[1]).line.classList.contains('lit') : false);
      g.classList.toggle('lit', query !== '' && hit);
    });
  };
}

function systemFlow(view, param) {
  const all = services.flatMap(s => s.aggregates);
  stats([['Service', services.length], ['Aggregate', all.length], ['Endpoint', count(all, a => a.endpoints)],
    ['Event', index.contracts.length], ['External System', index.externals.size]]);
  const names = [...new Set(index.contracts.flatMap(c => [...index.sourcesOf(c), ...index.targetsOf(c)]))];
  const order = n => (n.startsWith('external') ? '1' : '0') + title(n);
  const producers = names.filter(n => index.contracts.some(c => index.sourcesOf(c).includes(n))).sort((a, b) => order(a).localeCompare(order(b)));
  const consumers = names.filter(n => index.contracts.some(c => index.targetsOf(c).includes(n))).sort((a, b) => order(a).localeCompare(order(b)));
  const links = index.contracts.flatMap(c => index.sourcesOf(c).flatMap(s => index.targetsOf(c).map(t => ({
    from: ['out:' + s, c], to: ['in:' + t, c], color: serviceColor(s), group: c, title: c + '  ' + title(s) + ' → ' + title(t)
  }))));
  board(view, {
    glyph: 'flow', label: 'Event Flow',
    columns: [
      { label: 'Publishers', cards: producers.map(p => serviceCard(p, 'out', index.contracts.filter(c => index.sourcesOf(c).includes(p))
        .map(c => ({ id: c, label: c, ports: { out: true }, color: serviceColor(p), group: c, href: to('contracts', c) })))) },
      { label: 'Consumers', cards: consumers.map(t => serviceCard(t, 'in', index.contracts.filter(c => index.targetsOf(c).includes(t))
        .map(c => ({ id: c, label: c, ports: { in: true }, inColor: serviceColor(index.sourcesOf(c)[0]), group: c, href: to('contracts', c) })))) }
    ],
    links,
    focus: !param ? null : index.contracts.includes(param) ? { card: 'out:' + index.sourcesOf(param)[0], row: param }
      : producers.includes(param) ? { card: 'out:' + param } : { card: 'in:' + param }
  });
}

function callGraph() {
  const useCases = new Map();
  const consumers = new Map();
  const reactions = new Map();
  const entries = [];
  const translations = new Map();
  services.forEach(s => s.aggregates.forEach(a => {
    a.publishes.filter(p => p.from).forEach(p => translations.set(s.service + ':' + p.from, p.contract));
    a.useCases.forEach(u => useCases.set(s.service + ':' + u.name, { service: s.service, aggregate: a.name, name: u.name, emits: u.emits || [], publishes: u.publishes || [], uses: (u.uses || []).filter(d => d !== 'Events'), calls: u.calls || {} }));
    a.endpoints.filter(e => e.manual).forEach(e => useCases.set(s.service + ':' + e.manual,
      { service: s.service, aggregate: a.name, name: e.manual, manual: true, emits: e.emits || [], publishes: e.publishes || [], uses: [] }));
    a.consumes.forEach(c => push(consumers, c.contract, s.service + ':' + (c.useCase || c.manual)));
    a.domainEvents.forEach(d => push(reactions, s.service + ':' + d.event, s.service + ':' + d.useCase));
    a.endpoints.forEach(e => entries.push({ kind: 'http', service: s.service, method: e.method, path: e.path, annotations: e.annotations || [],
      access: e.manual ? 'Manual' : e.access === 'public' ? 'Public' : e.access, target: s.service + ':' + (e.useCase || e.manual) }));
    a.schedules.forEach(t => entries.push({ kind: 'schedule', service: s.service, every: t.every, target: s.service + ':' + t.useCase }));
  }));
  index.contracts.filter(c => index.sourcesOf(c).every(x => x === EXTERNAL || x.startsWith('external:'))).forEach(c =>
    (consumers.get(c) || []).forEach(target => entries.push({ kind: 'event', service: target.split(':')[0], contract: c, source: index.sourcesOf(c)[0], target })));
  services.forEach(s => s.aggregates.forEach(a => [...a.endpoints, ...a.consumes].forEach(e => {
    const u = useCases.get(s.service + ':' + (e.useCase || e.manual));
    if (u) u.annotations = [...new Set([...(u.annotations || []), ...(e.annotations || [])])];
  })));
  entries.forEach(e => { if (e.kind === 'event') e.annotations = (useCases.get(e.target) || {}).annotations || []; });
  const infra = new Map(services.map(s => [s.service, { store: s.store || 'Store', adapters: s.adapters || {} }]));
  return { useCases, consumers, reactions, entries, translations, infra };
}

function steps(trace) {
  return trace.nodes.filter(n => !['dep', 'infra'].includes(n.type)).length - 1;
}

function depKind(name) {
  return /Repository(<.*>)?$/.test(name) ? 'Repository' : /Queries$/.test(name) ? 'Query' : ['Clock', 'Events'].includes(name) ? 'Platform' : 'Port';
}

function entryLabel(entry) {
  if (entry.kind === 'http') return entry.method + ' ' + entry.path;
  if (entry.kind === 'schedule') return 'Every ' + entry.every;
  return entry.contract;
}

function traceFrom(graph, entry) {
  const nodes = [];
  const links = [];
  const add = (node, depth, parent, color, fromRow) => {
    node.depth = depth;
    nodes.push(node);
    if (parent) {
      const reaction = parent.type === 'domain' && node.type === 'usecase';
      const infra = ['dep', 'infra'].includes(node.type);
      links.push({ from: [parent.id, fromRow || null], to: [node.id, null], color, kind: node.type === 'dep' ? 'calls' : node.type === 'infra' ? 'backed' : reaction ? 'reaction' : 'flow',
        title: reaction ? 'In-process reaction' : node.type === 'dep' ? 'Uses ' + node.name : node.type === 'infra' ? 'Backed by infrastructure' : parent.type === 'domain' ? 'Published through the outbox' : undefined });
    }
    return node;
  };
  const expand = (key, depth, parent, color, path) => {
    const useCase = graph.useCases.get(key);
    if (!useCase) return;
    const looped = path.includes(key);
    const node = add({ id: parent.id + '>' + key, type: 'usecase', key, useCase, looped, outputs: [] }, depth, parent, color);
    if (looped || depth > 14) return;
    const next = [...path, key];
    const own = serviceColor(useCase.service);
    (useCase.uses || []).filter(d => depKind(d) !== 'Platform').forEach(d => {
      const methods = (useCase.calls || {})[d] || [];
      const dep = add({ id: node.id + '>dep:' + d, type: 'dep', name: d, service: useCase.service, calls: methods }, depth + 1, node, own,
        methods.length ? 'use:' + d + '#' + methods[0] : 'use:' + d);
      if (methods.length) links[links.length - 1].to = [dep.id, 'm:' + methods[0]];
      methods.slice(1).forEach(m => links.push({ from: [node.id, 'use:' + d + '#' + m], to: [dep.id, 'm:' + m], color: own, kind: 'calls', title: d + '.' + m + '()' }));
      add({ id: dep.id + '>infra', type: 'infra', name: d, service: useCase.service }, depth + 2, dep, own);
    });
    const publish = (contract, depth, parent, fromRow) => {
      const event = add({ id: parent.id + '>' + contract, type: 'event', contract }, depth, parent, own, fromRow);
      (graph.consumers.get(contract) || []).forEach(target => expand(target, depth + 1, event, own, next));
      index.targetsOf(contract).filter(t => t === EXTERNAL || t.startsWith('external:'))
        .forEach(t => add({ id: event.id + '>' + t, type: 'external', name: t }, depth + 1, event, own));
    };
    const translated = new Set();
    useCase.emits.forEach(domainEvent => {
      const contract = graph.translations.get(useCase.service + ':' + domainEvent);
      const reacting = graph.reactions.get(useCase.service + ':' + domainEvent) || [];
      if (!contract && !reacting.length) return;
      node.outputs.push({ name: domainEvent, kind: 'domain' });
      const event = add({ id: node.id + '>' + domainEvent, type: 'domain', name: domainEvent, service: useCase.service }, depth + 1, node, own, 'emit:' + domainEvent);
      if (contract) {
        translated.add(contract);
        publish(contract, depth + 2, event);
      }
      reacting.forEach(target => expand(target, depth + 2, event, own, next));
    });
    useCase.publishes.filter(contract => !translated.has(contract)).forEach(contract => {
      node.outputs.push({ name: contract, kind: 'event' });
      publish(contract, depth + 1, node, 'emit:' + contract);
    });
  };
  const root = add({ id: 'entry', type: 'entry', entry }, 0, null);
  expand(entry.target, 1, root, entryColor(entry), []);
  return { nodes, links };
}

function systemCalls(view, param) {
  const graph = callGraph();
  const traces = graph.entries.map(entry => ({ entry, trace: traceFrom(graph, entry) }));
  const scoped = param && param.startsWith('agg:') ? param.slice(4).split(':') : null;
  const chosen = !scoped && param !== undefined && traces[Number(param)] ? Number(param) : null;
  view.classList.add('split');
  view.append(entryPicker(graph, traces, chosen, scoped ? scoped.join(':') : null));
  if (scoped) callsAggregate(view, graph, traces, scoped[0], scoped[1]);
  else if (chosen === null) callsOverview(view, graph, traces); else callTrace(view, graph, traces[chosen]);
}

function routeLabel(path, breakable = true) {
  const node = el('span', 'code route');
  path.split('/').forEach((part, i) => {
    if (i > 0) node.append(...(breakable ? [document.createElement('wbr')] : []), document.createTextNode('/'));
    node.append(part.startsWith('{') ? el('span', 'param', part) : document.createTextNode(part));
  });
  return node;
}

function entryRowLabel(entry) {
  if (entry.kind === 'http') return inline(method(entry.method), routeLabel(entry.path));
  if (entry.kind === 'schedule') return inline(icon('schedule', 'S'), el('span', null, 'Every ' + entry.every));
  return inline(icon('event', 'E'), el('span', 'code', entry.contract));
}

function callsOverview(view, graph, traces) {
  const used = [...new Set(traces.map(t => t.entry.target))].map(key => graph.useCases.get(key)).filter(Boolean);
  const publishing = used.filter(u => u.publishes.length);
  const using = used.filter(u => u.uses.length);
  const depOrder = ['Port', 'Query', 'Repository', 'Platform'];
  stats([['Entry Point', traces.length], ['Use Case', used.length], ['Published Event', new Set(publishing.flatMap(u => u.publishes)).size], ['Dependency', new Set(using.flatMap(u => u.uses.map(d => u.service + d))).size]]);
  const byService = names => [...new Set(names)].sort();
  const sectionOf = entry => entry.kind === 'schedule' ? 'Schedules' : entry.kind === 'event' ? 'Events' : '';
  const kindOrder = { http: 0, schedule: 1, event: 2 };
  const entryRow = i => ({ id: 'e' + i, section: sectionOf(traces[i].entry), label: entryRowLabel(traces[i].entry), code: false, ports: { out: true }, color: entryColor(traces[i].entry),
    tag: [...(traces[i].entry.kind === 'http' ? [accessTag(traces[i].entry.access)] : []), countTag(steps(traces[i].trace))], sub: annotationTags(traces[i].entry.annotations), subUnder: traces[i].entry.kind === 'http' ? 'path' : 'icon',
    onClick: () => go('system/calls/' + i), openLabel: 'Flow', terms: [traces[i].entry.target.split(':')[1]], inspectTitle: entryLabel(traces[i].entry) });
  const aggregates = byService(used.map(u => u.service + ':' + u.aggregate));
  const links = [
    ...traces.map((t, i) => ({ from: ['entries:' + t.entry.service, 'e' + i], to: ['cases:' + graph.useCases.get(t.entry.target).service + ':' + graph.useCases.get(t.entry.target).aggregate, t.entry.target],
      color: entryColor(t.entry) })),
    ...publishing.flatMap(u => u.publishes.map(c => ({ from: ['cases:' + u.service + ':' + u.aggregate, u.service + ':' + u.name], to: ['events:' + u.service, c], color: serviceColor(u.service), group: c }))),
    ...using.flatMap(u => u.uses.map(d => ({ from: ['cases:' + u.service + ':' + u.aggregate, u.service + ':' + u.name], to: ['uses:' + u.service, d], kind: 'calls', group: u.service + '|' + d }))),
    ...byService(using.map(u => u.service)).flatMap(s => byService(using.filter(u => u.service === s).flatMap(u => u.uses)).flatMap(d => {
      const kind = depKind(d);
      if (kind === 'Repository') return [{ from: ['uses:' + s, d], to: ['infra:' + s, 'store'], kind: 'backed', group: s + '|' + d }];
      if (kind === 'Platform') return [];
      const adapters = graph.infra.get(s).adapters[d];
      return (adapters && adapters.length ? adapters : [d]).map(a => ({ from: ['uses:' + s, d], to: ['infra:' + s, 'adapter:' + a], kind: 'backed', group: s + '|' + d }));
    }))
  ];
  board(view, {
    glyph: 'calls', label: 'Call Flows', cardWidth: 248, gap: 150,
    columns: [
      { label: 'Entry Points', cards: byService(traces.map(t => t.entry.service)).map(s => serviceCard(s, 'entries',
        traces.map((t, i) => i).filter(i => traces[i].entry.service === s)
          .sort((x, y) => kindOrder[traces[x].entry.kind] - kindOrder[traces[y].entry.kind]).map(entryRow))) },
      { label: 'Use Cases', cards: aggregates.map(key => {
        const [service, aggregate] = key.split(':');
        return { id: 'cases:' + key, href: to('calls', 'agg:' + service + ':' + aggregate), group: service, glyph: 'aggregate', tag: 'Aggregate', title: aggregate, meta: svc(service), color: serviceColor(service), badges: stackBadges(service),
          rows: used.filter(u => u.service === service && u.aggregate === aggregate).map(u => ({ id: u.service + ':' + u.name,
            label: inline(u.manual ? icon('class', 'C') : icon('usecase', 'U'), el('span', 'name', u.name)), code: false, href: 'service/' + service, sub: annotationTags(u.annotations), subUnder: 'icon',
            ports: { in: true, out: u.publishes.length > 0 || u.uses.length > 0 }, color: serviceColor(service), inColor: serviceColor(service) })) };
      }) },
      { label: 'Effects', cards: [
        ...byService(publishing.map(u => u.service)).map(s => ({ ...serviceCard(s, 'events',
          byService(publishing.filter(u => u.service === s).flatMap(u => u.publishes)).map(c => ({ id: c, label: c, ports: { in: true }, group: c, href: to('contracts', c) }))), meta: 'Publishes' })),
        ...byService(using.map(u => u.service)).map(s => ({ ...serviceCard(s, 'uses',
          byService(using.filter(u => u.service === s).flatMap(u => u.uses)).sort((a, b) => depOrder.indexOf(depKind(a)) - depOrder.indexOf(depKind(b)))
            .map(d => ({ id: d, label: d, href: to('dependencies', s + '|' + d), source: typeSources(s, d), ports: { in: true, out: depKind(d) !== 'Platform' }, tag: el('span', 'tag kind-' + depKind(d).toLowerCase(), depKind(d)) }))), meta: 'Calls' }))
      ] },
      { label: 'Infrastructure', cards: byService(using.map(u => u.service)).map(s => {
        const infra = graph.infra.get(s);
        const deps = byService(using.filter(u => u.service === s).flatMap(u => u.uses));
        const rows = [];
        if (deps.some(d => depKind(d) === 'Repository')) rows.push({ id: 'store', label: inline(glyph('database'), el('span', null, infra.store)), code: false, ports: { in: true }, source: [{ service: s, type: repositoryImplementation(s) }], href: to('dependencies', s + '|' + deps.find(d => depKind(d) === 'Repository')) });
        deps.filter(d => ['Port', 'Query'].includes(depKind(d))).forEach(d => (infra.adapters[d] && infra.adapters[d].length ? infra.adapters[d] : [null]).forEach(a =>
          rows.push({ id: 'adapter:' + (a || d), label: inline(glyph('adapter'), el('span', 'code', a || 'No Adapter Found')), code: false, ports: { in: true }, source: a ? [{ service: s, type: a }] : undefined, note: a ? d : null, muted: !a, href: to('dependencies', s + '|' + d) })));
        return { ...serviceCard(s, 'infra', rows), meta: 'Infrastructure' };
      }) }
    ],
    links
  });
}

function callsAggregate(view, graph, traces, service, aggregate, extra) {
  const own = [...graph.useCases.values()].filter(u => u.service === service && (!aggregate || u.aggregate === aggregate));
  const ownKeys = new Set(own.map(u => service + ':' + u.name));
  const color = serviceColor(service);
  const aggId = (s, a) => 'agg:' + s + ':' + a;
  const selfOf = u => aggId(service, u.aggregate);
  const scope = [...new Set(own.map(u => u.aggregate))];
  const selfs = new Set(scope.map(a => aggId(service, a)));
  const columns = { trig: [], effects: [], reach: [] };
  const links = [];
  const cards = new Map();
  const card = (column, id, make) => { if (!cards.has(id)) { const c = make(); c.rows = c.rows || []; cards.set(id, c); columns[column].push(c); } return cards.get(id); };
  const addRow = (c, row) => { if (!c.rows.some(r => r.id === row.id)) c.rows.push(row); };
  const neighbor = (column, s, a) => card(column, column + ':' + aggId(s, a), () => ({ id: column + ':' + aggId(s, a), glyph: 'aggregate', tag: 'Aggregate', title: a, meta: svc(s),
    badges: stackBadges(s), color: serviceColor(s), href: to('calls', 'agg:' + s + ':' + a), fixedRows: true }));

  traces.forEach(({ entry, trace }, i) => {
    if (!ownKeys.has(entry.target)) return;
    const c = card('trig', 'entries:' + entry.service, () => ({ ...serviceCard(entry.service, 'entries', []), id: 'entries:' + entry.service, fixedRows: true }));
    addRow(c, { id: 'e' + i, section: entry.kind === 'schedule' ? 'Schedules' : entry.kind === 'event' ? 'Events' : '', label: entryRowLabel(entry), code: false,
      ports: { out: true }, href: 'system/calls/' + i, openLabel: 'Flow', terms: [entry.target.split(':')[1]], inspectTitle: entryLabel(entry),
      tag: [...(entry.kind === 'http' ? [accessTag(entry.access)] : []), countTag(steps(trace))], sub: annotationTags(entry.annotations), subUnder: entry.kind === 'http' ? 'path' : 'icon' });
    links.push({ from: ['entries:' + entry.service, 'e' + i], to: [selfOf(graph.useCases.get(entry.target)), entry.target], color: entryColor(entry) });
  });
  const sectionRank = { '': 0, Schedules: 1, Events: 2 };
  columns.trig.forEach(c => c.rows.sort((x, y) => (sectionRank[x.section || ''] || 0) - (sectionRank[y.section || ''] || 0)));

  own.forEach(u => {
    services.find(x => x.service === service).aggregates.find(a => a.name === u.aggregate).consumes
      .filter(c => (c.useCase || c.manual) === u.name).forEach(c => {
        const sources = [...graph.useCases.values()].filter(x => x.publishes.includes(c.contract));
        if (!sources.length) return;
        sources.forEach(src => {
          const n = neighbor('trig', src.service, src.aggregate);
          addRow(n, { id: c.contract, label: c.contract, lead: icon('event', 'E'), ports: { out: true }, alignLeft: true, href: to('contracts', c.contract) });
          links.push({ from: [n.id, c.contract], to: [selfOf(u), service + ':' + u.name], color: serviceColor(src.service), title: c.contract });
        });
      });
  });
  [...graph.reactions.entries()].forEach(([key, targets]) => {
    const [s, domainEvent] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    targets.filter(t => ownKeys.has(t)).forEach(t => {
      const src = [...graph.useCases.values()].find(x => x.service === s && x.emits.includes(domainEvent) && !ownKeys.has(s + ':' + x.name));
      if (!src) return;
      const n = neighbor('trig', src.service, src.aggregate);
      addRow(n, { id: domainEvent, label: domainEvent, lead: icon('domain', 'D'), ports: { out: true }, alignLeft: true });
      links.push({ from: [n.id, domainEvent], to: [selfOf(graph.useCases.get(t)), t], color: serviceColor(s), kind: 'reaction' });
    });
  });

  const emits = card('effects', 'emits', () => ({ id: 'emits', glyph: 'contracts', title: 'Emits', meta: aggregate ? aggregate + ' Aggregate' : svc(service), fixedRows: true }));
  own.forEach(u => {
    const translated = new Set();
    u.emits.forEach(d => {
      const contract = graph.translations.get(service + ':' + d);
      const reacting = graph.reactions.get(service + ':' + d) || [];
      if (!contract && !reacting.length) return;
      if (contract) translated.add(contract);
      addRow(emits, { id: 'd:' + d, label: d, lead: icon('domain', 'D'), note: contract ? '→ ' + contract : null, ports: { in: true, out: true }, alignLeft: true,
        href: contract ? to('contracts', contract) : null });
      links.push({ from: [selfOf(u), service + ':' + u.name], to: ['emits', 'd:' + d], color });
      if (contract) reachContract(contract, 'd:' + d);
      reacting.filter(t => !ownKeys.has(t)).forEach(t => {
        const target = graph.useCases.get(t);
        const n = neighbor('reach', target.service, target.aggregate);
        addRow(n, { id: target.name, label: inline(icon('usecase', 'U'), el('span', 'name', target.name)), code: false, ports: { in: true }, alignLeft: true });
        links.push({ from: ['emits', 'd:' + d], to: [n.id, target.name], color, kind: 'reaction' });
      });
    });
    u.publishes.filter(c => !translated.has(c)).forEach(c => {
      addRow(emits, { id: 'c:' + c, label: c, lead: icon('event', 'E'), ports: { in: true, out: true }, alignLeft: true, href: to('contracts', c) });
      links.push({ from: [selfOf(u), service + ':' + u.name], to: ['emits', 'c:' + c], color });
      reachContract(c, 'c:' + c);
    });
  });
  function reachContract(contract, row) {
    (graph.consumers.get(contract) || []).forEach(t => {
      const target = graph.useCases.get(t);
      if (!target) return;
      const n = neighbor('reach', target.service, target.aggregate);
      addRow(n, { id: target.name, label: inline(icon('usecase', 'U'), el('span', 'name', target.name)), code: false, ports: { in: true }, alignLeft: true });
      links.push({ from: ['emits', row], to: [n.id, target.name], color, title: contract });
    });
    index.targetsOf(contract).filter(t => t === EXTERNAL || t.startsWith('external:')).forEach(t => {
      const n = card('reach', 'ext:' + t, () => ({ ...serviceCard(t, 'reach', []), id: 'ext:' + t }));
      links.push({ from: ['emits', row], to: [n.id, null], color, title: contract });
    });
  }
  if (!emits.rows.length) { columns.effects.splice(columns.effects.indexOf(emits), 1); cards.delete('emits'); }

  own.forEach(u => (u.uses || []).filter(d => depKind(d) !== 'Platform').forEach(d => {
    const methods = (u.calls || {})[d] || [];
    const dep = card('effects', 'dep:' + d, () => ({ ...depCard('dep:' + d, service, d, new Set()), rows: [] }));
    (methods.length ? methods : [null]).forEach(m => {
      const info = depInfo(service, d);
      const sig = m && info ? info.methods.find(x => x.name === m) : null;
      if (m) addRow(dep, { id: 'm:' + m, label: sig ? signatureLabel(sig) : m, code: false, ports: { in: true }, source: methodSources(service, d, m), inspectTitle: sig ? m + '(' + sig.params.join(', ') + ')' : m + '()' });
      links.push({ from: [selfOf(u), service + ':' + u.name], to: ['dep:' + d, m ? 'm:' + m : null], kind: 'calls', title: d + (m ? '.' + m + '()' : '') });
    });
    const infra = card('reach', 'infra:' + d, () => infraCard('infra:' + d, service, d));
    if (!links.some(l => l.from[0] === 'dep:' + d)) links.push({ from: ['dep:' + d, null], to: [infra.id, null], kind: 'backed' });
  }));

  const aggCards = scope.map(name => ({ id: aggId(service, name), glyph: 'aggregate', tag: 'Aggregate', title: name, meta: svc(service), badges: stackBadges(service), color,
    href: aggregate ? 'service/' + service : to('calls', 'agg:' + service + ':' + name), fixedRows: true,
    rows: own.filter(u => u.aggregate === name).map(u => ({ id: service + ':' + u.name, label: inline(u.manual ? icon('class', 'C') : icon('usecase', 'U'), el('span', 'name', u.name)), code: false,
      ports: { in: true, out: true }, alignLeft: true, sub: annotationTags(u.annotations), subUnder: 'icon', terms: [u.name] })) }));
  stats([['Use Case', own.length], ['Trigger', links.filter(l => selfs.has(l.to[0])).length], ['Effect', columns.effects.reduce((n, c) => n + c.rows.length, 0)]]);
  board(view, {
    glyph: 'calls', label: 'Call Flows', cardWidth: 248, gap: 260,
    ...(extra || {}),
    columns: [
      { label: 'Triggered By', cards: columns.trig },
      { label: aggregate ? 'Aggregate' : 'Aggregates', cards: aggCards },
      { label: 'Effects', cards: columns.effects },
      { label: 'Reaches', cards: columns.reach }
    ],
    links
  });
}

function callTrace(view, graph, chosen) {
  const { entry, trace } = chosen;
  stats([['Step', steps(trace)], ['Use Case', trace.nodes.filter(n => n.type === 'usecase').length],
    ['Service', new Set(trace.nodes.filter(n => n.type === 'usecase').map(n => n.useCase.service)).size]]);
  const levels = Math.max(...trace.nodes.map(n => n.depth)) + 1;
  const card = node => {
    const hasChildren = trace.links.some(l => l.from[0] === node.id);
    const ports = { in: node.depth > 0, out: hasChildren };
    if (node.type === 'entry') {
      const e = node.entry;
      const access = e.kind === 'http' ? accessTag(e.access) : e.kind === 'schedule' ? tag('Schedule') : tag('Event');
      return { id: node.id, glyph: e.kind === 'event' ? 'contracts' : 'calls', title: entryLabel(e), titleCode: true,
        meta: e.kind === 'event' ? 'From ' + svc(e.source) : svc(e.service), badges: [access, ...annotationTags(e.annotations)], color: serviceColor(e.service), ports, terms: [e.target.split(':')[1]], openLabel: 'Service',
        href: e.kind === 'event' ? to('contracts', e.contract) : 'service/' + e.service };
    }
    if (node.type === 'usecase') {
      const u = node.useCase;
      const rows = node.looped ? [] : [
        ...(u.uses || []).flatMap(d => ((u.calls || {})[d] || []).length
          ? u.calls[d].map(m => ({ id: 'use:' + d + '#' + m, section: 'Calls', label: d + '.' + m + '()', ports: { out: depKind(d) !== 'Platform' }, alignLeft: true,
              href: to('dependencies', u.service + '|' + d), tag: el('span', 'tag kind-' + depKind(d).toLowerCase(), depKind(d)) }))
          : [{ id: 'use:' + d, section: 'Calls', label: d, tag: el('span', 'tag kind-' + depKind(d).toLowerCase(), depKind(d)), ports: { out: depKind(d) !== 'Platform' }, alignLeft: true, href: to('dependencies', u.service + '|' + d) }]),
        ...node.outputs.map(o => ({ id: 'emit:' + o.name, section: node.outputs.length > 1 ? 'May Emit' : 'Emits', label: o.name,
          lead: icon(o.kind === 'domain' ? 'domain' : 'event', o.kind === 'domain' ? 'D' : 'E'), ports: { out: true }, alignLeft: true,
          href: to('contracts', o.kind === 'domain' ? (contractOf(u.service, o.name) || '') : o.name) }))
      ];
      return { id: node.id, glyph: 'usecase', tag: 'Use Case', title: u.name, meta: u.aggregate + ' Aggregate, ' + svc(u.service) + (node.looped ? ', Already Shown' : ''),
        badges: [...annotationTags(u.annotations), ...stackBadges(u.service)], color: serviceColor(u.service), ports: { in: true, out: false }, rows, fixedRows: true,
        dashed: node.looped, onClick: () => go('service/' + u.service) };
    }
    if (node.type === 'dep') return { ...depCard(node.id, node.service, node.name, new Set(node.calls)), ports };
    if (node.type === 'infra') return { ...infraCard(node.id, node.service, node.name), ports };
    if (node.type === 'event') {
      const receivers = trace.links.filter(l => l.from[0] === node.id).length;
      return { id: node.id, glyph: 'contracts', title: node.contract, titleCode: true, meta: 'Integration Event' + (receivers > 1 ? ', Delivered To ' + receivers : ''), ports, href: to('contracts', node.contract) };
    }
    if (node.type === 'domain') return { id: node.id, glyph: 'domain', title: node.name, titleCode: true, meta: 'Domain Event, ' + svc(node.service), ports,
      href: contractOf(node.service, node.name) ? to('contracts', contractOf(node.service, node.name)) : 'service/' + node.service };
    return { ...serviceCard(node.name, 'end', []), id: node.id, ports };
  };
  const columns = Array.from({ length: levels }, (_, d) => ({
    label: d === 0 ? 'Entry' : '',
    cards: trace.nodes.filter(n => n.depth === d).map(card)
  }));
  board(view, { glyph: 'calls', label: 'Call Flows', columns, links: trace.links, cardWidth: 236, gap: levels > 4 ? 96 : 160 });
}

function entryPicker(graph, traces, chosen, scoped) {
  const picker = el('nav', 'entry-picker');
  const overview = el('button', 'picker-row picker-overview');
  overview.type = 'button';
  overview.append(glyph('system'), el('span', null, 'Overview'));
  if (chosen === null && !scoped) overview.setAttribute('aria-current', 'true');
  overview.addEventListener('click', () => go('system/calls'));
  const pin = el('div', 'picker-pin');
  pin.append(overview);
  picker.append(pin);
  const order = { http: 0, schedule: 1, event: 2 };
  [...new Set(graph.entries.map(e => e.service))].sort().forEach(service => {
    const own = traces.map((t, i) => ({ ...t, i })).filter(t => t.entry.service === service)
      .sort((x, y) => order[x.entry.kind] - order[y.entry.kind]);
    const group = el('details', 'picker-group');
    group.open = true;
    const head = el('summary', 'picker-service');
    head.append(el('span', 'picker-name', title(service)), el('span', 'picker-total', String(own.length)));
    group.append(head);
    group.append(el('div', 'picker-kind picker-kind-top', 'Aggregates'));
    services.find(x => x.service === service).aggregates.filter(a => a.useCases.length).forEach(a => {
      const row = el('button', 'picker-row picker-aggregate');
      row.type = 'button';
      if (scoped === service + ':' + a.name) row.setAttribute('aria-current', 'true');
      row.append(icon('aggregate', 'A'), el('span', 'picker-text', a.name));
      row.addEventListener('click', () => go(to('calls', 'agg:' + service + ':' + a.name)));
      group.append(row);
    });
    let previous = 'http';
    let first = true;
    own.forEach(({ entry, trace, i }) => {
      if (entry.kind !== previous) {
        group.append(el('div', 'picker-kind', entry.kind === 'schedule' ? 'Schedules' : 'Events'));
        previous = entry.kind;
      }
      const row = el('button', 'picker-row' + (first && entry.kind === 'http' ? ' picker-first-route' : ''));
      first = false;
      row.type = 'button';
      if (i === chosen) row.setAttribute('aria-current', 'true');
      if (entry.kind === 'http') row.append(method(entry.method), routeLabel(entry.path, false));
      else if (entry.kind === 'schedule') row.append(icon('schedule', 'S'), el('span', 'picker-text', 'Every ' + entry.every));
      else {
        row.append(icon('event', 'E'), el('span', 'code picker-text', entry.contract));
        row.title = entry.contract + ' from ' + title(entry.source);
      }
      const total = steps(trace);
      if (total > 1) {
        const count = el('span', 'picker-steps', String(total));
        count.title = amount(total, 'Step');
        row.append(count);
      }
      row.addEventListener('click', () => go('system/calls/' + i));
      group.append(row);
    });
    picker.append(group);
  });
  picker.addEventListener('pointerdown', event => event.stopPropagation());
  picker.addEventListener('wheel', event => event.stopPropagation());
  return picker;
}

function contractFields(contract) {
  for (const s of services) {
    for (const a of s.aggregates) {
      const hit = [...a.publishes, ...a.consumes].find(x => x.contract === contract && x.fields);
      if (hit) return hit.fields;
    }
  }
  return [];
}

          badges: stackBadges(p.service),
          rows: flatten(p.domainFields, 0, '').map(f => ({ id: f.path, label: f.name, indent: f.depth, note: f.type,
            ports: { out: Object.values(p.mapping || {}).includes(f.path) },
            muted: !Object.values(p.mapping || {}).some(v => v === f.path || v.startsWith(f.path + '.') || f.path.startsWith(v + '.')) })) })),
        ...[...origins.values()].map(o => o.kind === 'usecase'
          ? { id: o.id, glyph: 'usecase', tag: 'Use Case', title: o.name, meta: 'Publishes Directly, ' + svc(o.service), ports: { out: true }, badges: stackBadges(o.service), href: 'service/' + o.service }
          : { ...serviceCard(o.name, 'source', []), id: o.id, ports: { out: true } })
      ] },

        ports: { in: !viaDomain(c) },

function momentBlock(text, name) {
  const lines = text.split(NL);
  const start = lines.findIndex(l => new RegExp('\\b(class|record)\\s+' + name + '\\b').test(l) || new RegExp('\\s' + name + '\\s*\\(World\\b').test(l));
  if (start < 0) return '';
  let depth = 0, opened = false;
  for (let k = start; k < lines.length; k++) {
    for (const c of lines[k]) { if (c === '{') { depth++; opened = true; } if (c === '}') depth--; }
    if (opened && depth <= 0) return lines.slice(start, k + 1).join(NL);
  }
  return lines.slice(start).join(NL);
}

function momentCalls(m, names) {
  if (!m.source) return [];
  let body = names.map(n => momentBlock(m.source.text, n)).join(NL);
  const helpers = [...new Set([...body.matchAll(/\b([a-z]\w*)\(world\b/g)].map(x => x[1]))];
  body += NL + helpers.map(n => momentBlock(m.source.text, n)).join(NL);
  const calls = [];
  for (const x of body.matchAll(/world\.(post|get|put|patch|delete)\(\s*"(\w+)"\s*,\s*([^,)]+(?:\([^)]*\)[^,)]*)*)/g)) {
    const path = x[3].split('+').map(p => p.trim()).map(p => /^"[^"]*"$/.test(p) ? p.slice(1, -1) : '{id}').join('');
    const tail = body.slice(x.index, body.indexOf(';', x.index));
    const expect = (tail.match(/\.expect\((\d+)\)/) || [])[1];
    calls.push({ method: x[1].toUpperCase(), service: x[2], path, expect });
  }
  return calls.filter((c, i, all) => all.findIndex(o => o.method === c.method && o.service === c.service && o.path === c.path) === i);
}

function momentDeclaration(m) {
  if (!m.source) return null;
  const lines = m.source.text.split(NL);
  const at = lines.findIndex(l => l.includes('moment("' + m.name + '")'));
  if (at < 0) return null;
  let end = at;
  while (end < lines.length - 1 && !lines[end].trim().endsWith(';')) end++;
  const decl = lines.findIndex(l => /\bclass\s/.test(l));
  const rows = [];
  if (decl >= 0 && decl < at) {
    rows.push({ line: decl + 1, text: lines[decl].trim(), indent: 0 });
    if (at - decl > 1) rows.push({ gap: true, indent: 4 });
  }
  for (let i = at; i <= end; i++) rows.push({ line: i + 1, text: lines[i].trim(), indent: lines[i].match(/^ */)[0].length, hit: true });
  return { file: m.source.file, rows, chain: true };
}

function entryIndexFor(graph, call) {
  const matches = (pattern, path) => new RegExp('^' + pattern.replace(/\{[^}]+\}/g, '[^/]+') + '$').test(path.replace(/\{[^}]+\}/g, 'x'));
  return graph.entries.findIndex(e => e.kind === 'http' && e.service === call.service && e.method === call.method && matches(e.path, call.path));
}

function systemMoments(view, param, extra) {
  const owner = new Map(services.flatMap(s => s.aggregates.map(a => [packageOf(a.type), s.service])));
  const serviceOf = m => owner.get(m.package) || EXTERNAL;
  const byName = new Map(moments.map(m => [m.name, m]));
  const shown = extra && extra.service ? momentsOf(extra.service, moments, serviceOf, byName) : moments;
  const graph = callGraph();
  const depth = m => { let d = 0; for (let x = m; x.from && byName.has(x.from); x = byName.get(x.from)) d++; return d; };
  const levels = Math.max(1, ...shown.map(m => depth(m) + 1));
  stats([['Moment', shown.length], ['Root', shown.filter(m => !m.from).length], ['Service', new Set(shown.map(serviceOf)).size]]);
  const callRow = (m, call, i, section) => {
    const index = entryIndexFor(graph, call);
    return { id: m.name + '#' + section + i, section, label: inline(method(call.method), routeLabel(call.path, false)), code: false,
      tag: [tag(title(call.service)), ...(call.expect ? [tag(call.expect)] : [])], href: index >= 0 ? 'system/calls/' + index : null, openLabel: 'Flow',
      snippets: [momentDeclaration(m)].filter(Boolean), inspectTitle: call.method + ' ' + call.path, terms: [] };
  };
  const card = m => {
    const children = shown.filter(x => x.from === m.name);
    const recipe = m.recipe ? momentCalls(m, [m.recipe]) : [];
    const verify = momentCalls(m, m.verifies || []).filter(c => !recipe.some(r => r.method === c.method && r.path === c.path && r.service === c.service));
    const refs = [m.recipe, ...(m.verifies || [])].filter(Boolean).map(type => ({ type, source: m.source }));
    return {
      id: 'moment:' + m.name, group: 'moment:' + m.name, glyph: 'moments', tag: 'Moment', title: m.name, meta: svc(serviceOf(m)) + ', ' + m.owner,
      color: serviceColor(serviceOf(m)), ports: { in: true, out: children.length > 0 }, fixedRows: true,
      href: serviceOf(m) === EXTERNAL ? null : 'service/' + serviceOf(m) + '/moments/' + m.name, openLabel: 'Moment',
      inColor: m.from && byName.has(m.from) ? serviceColor(serviceOf(byName.get(m.from))) : 'var(--icon-gray)',
      snippets: [momentDeclaration(m)].filter(Boolean), source: refs, terms: [],
      rows: [
        ...recipe.map((c, i) => callRow(m, c, i, 'Recipe' + (m.recipe ? ', ' + m.recipe : ''))),
        ...m.checks.map((c, i) => ({ id: m.name + '#check' + i, section: 'Checks', label: c, wrap: true, code: false, lead: el('span', 'check-mark'), terms: [], snippets: [momentDeclaration(m)].filter(Boolean) })),
        ...verify.map((c, i) => callRow(m, c, i, 'Verifies Via')),
        ...(children.length
          ? children.map(c => ({ id: m.name + '#next' + c.name, section: 'Then Branches To', label: c.name, lead: el('span', 'branch-mark'), terms: [],
            onClick: () => go((extra && extra.service ? 'service/' + extra.service : 'system') + '/moments/' + c.name) }))
          : [{ id: m.name + '#end', section: 'Then', label: 'End', code: false, lead: el('span', 'end-mark'), muted: true, terms: [] }])
      ]
    };
  };
  const worldCard = world ? {
    id: 'world', glyph: 'system', tag: 'World', title: world.name, meta: 'Running System', fixedRows: true, ports: { out: true }, terms: [],
    rows: Object.entries(world.parts).flatMap(([part, items]) => items.map((item, i) => ({ id: part + i, section: part, code: part === 'Stores',
      label: part === 'Services' ? inline(el('span', 'service-dot'), el('span', null, title(item))) : item, terms: [],
      lead: null, tag: part === 'Services' ? stackBadges(item) : null })))
  } : null;
  if (worldCard) worldCard.rows.filter(r => r.section === 'Services').forEach(r => { r.label.firstChild.style.background = serviceColor(r.label.textContent.toLowerCase()); });
  const columns = [
    ...(worldCard ? [{ label: 'World', cards: [worldCard] }] : []),
    ...Array.from({ length: levels }, (_, d) => ({
      label: d === 0 ? 'Start' : 'Level ' + d,
      cards: shown.filter(m => depth(m) === d).sort((a, b) => serviceOf(a).localeCompare(serviceOf(b)) || a.name.localeCompare(b.name)).map(card)
    }))
  ];
  const links = [
    ...shown.filter(m => m.from && shown.some(x => x.name === m.from)).map(m => ({
      from: ['moment:' + m.from, null], to: ['moment:' + m.name, null], color: serviceColor(serviceOf(byName.get(m.from))), kind: 'snapshot',
      title: m.name + ' starts from the state ' + m.from + ' leaves' + (serviceOf(m) !== serviceOf(byName.get(m.from)) ? ', crossing into ' + title(serviceOf(m)) : '')
    })),
    ...(worldCard ? shown.filter(m => !m.from || !shown.some(x => x.name === m.from)).map(m => ({ from: ['world', null], to: ['moment:' + m.name, null], color: 'var(--icon-gray)', kind: 'snapshot',
      title: m.name + ' starts from a fresh ' + world.name })) : [])

  board(view, { glyph: 'moments', label: 'Moments', cardWidth: 300, fixedWidth: true, gap: 140, columns, links, focus: param ? { card: 'moment:' + param } : null, ...(extra || {}) });

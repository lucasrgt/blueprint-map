function momentsOf(service, all, serviceOf, byName) {
  const keep = new Set();
  all.filter(m => serviceOf(m) === service).forEach(m => {
    for (let x = m; x && !keep.has(x.name); x = x.from ? byName.get(x.from) : null) keep.add(x.name);
  });
  return all.filter(m => keep.has(m.name));
}

function systemDependencies(view, param) {
  const order = ['Port', 'Query', 'Repository', 'Platform'];
  const aggregates = services.flatMap(s => s.aggregates.map(a => ({ ...a, service: s.service })));
  const deps = new Map();
  aggregates.forEach(a => a.useCases.forEach(u => u.uses.filter(d => d !== 'Events').forEach(d =>
    push(deps, a.service + '|' + d, { aggregate: a.name, useCase: u.name, calls: (u.calls || {})[d] || [] }))));
  const keys = [...deps.keys()].sort((x, y) => x.split('|')[0].localeCompare(y.split('|')[0])
    || order.indexOf(depKind(x.split('|')[1])) - order.indexOf(depKind(y.split('|')[1])) || x.localeCompare(y));
  const kinds = keys.map(k => depKind(k.split('|')[1]));
  stats([['Dependency', keys.length], ['Port', kinds.filter(k => k === 'Port').length], ['Query', kinds.filter(k => k === 'Query').length],
    ['Repository', kinds.filter(k => k === 'Repository').length]]);
  const links = [];
  keys.forEach(key => {
    const [service, dep] = key.split('|');
    const info = depInfo(service, dep);
    deps.get(key).forEach(u => {
      const targets = info && u.calls.length ? u.calls.map(m => 'm:' + m) : [null];
      targets.forEach(row => links.push({ from: ['cases:' + service + ':' + u.aggregate, u.useCase], to: ['dep:' + key, row], kind: 'calls', group: key,
        title: u.useCase + ' → ' + dep + (row ? '.' + row.slice(2) : '') }));
    });
    if (depKind(dep) !== 'Platform') links.push({ from: ['dep:' + key, null], to: ['infra:' + key, null], kind: 'backed', group: key });
  });
  board(view, {
    glyph: 'dependencies', label: 'Dependencies', gap: 180,
    focus: param ? { card: 'dep:' + param } : null,
    columns: [
      { label: 'Use Cases', cards: aggregates.filter(a => a.useCases.some(u => u.uses.some(d => d !== 'Events'))).map(a => ({
        id: 'cases:' + a.service + ':' + a.name, group: a.service, glyph: 'aggregate', tag: 'Aggregate', title: a.name, meta: svc(a.service), color: serviceColor(a.service),
        href: 'service/' + a.service,
        rows: a.useCases.filter(u => u.uses.some(d => d !== 'Events')).map(u => ({ id: u.name, label: inline(icon('usecase', 'U'), el('span', 'name', u.name)), code: false,
          ports: { out: true }, color: serviceColor(a.service), alignLeft: true, href: 'service/' + a.service })) })) },
      { label: 'Dependencies', cards: keys.map(key => {
        const [service, dep] = key.split('|');
        const card = depCard('dep:' + key, service, dep, null);
        const used = new Set(deps.get(key).flatMap(u => u.calls));
        card.rows.forEach(r => { r.dim = !used.has(r.id.slice(2)); r.note = r.dim ? 'Unused' : null; });
        card.href = 'service/' + service;
        return card;
      }) },
      { label: 'Infrastructure', cards: keys.filter(k => depKind(k.split('|')[1]) !== 'Platform').map(key => {
        const [service, dep] = key.split('|');
        return { ...infraCard('infra:' + key, service, dep), href: 'service/' + service };
      }) }
    ],
    links
  });
}

const SERVICE_TABS = [{ id: 'overview', label: 'Overview' }, { id: 'map', label: 'Map' }, { id: 'moments', label: 'Moments' }, { id: 'blueprint', label: 'Blueprint' }];

function serviceView(view, service, tab, param) {
  const name = service.service;
  const tabs = SERVICE_TABS.map(t => ({ label: t.label, href: 'service/' + name + (t.id === 'overview' ? '' : '/' + t.id), active: t.id === tab }));
  const spec = { glyph: 'service', label: title(name), tabs };
  if (tab === 'moments') {
    systemMoments(view, param, { ...spec, service: name });
    return;
  }
  if (tab === 'blueprint') {
    blueprintPage(view, service, spec);
    return;
  }
  if (tab === 'overview') {
    serviceOverview(view, service, spec);
    return;
  }
  const graph = callGraph();
  const traces = graph.entries.map(entry => ({ entry, trace: traceFrom(graph, entry) }));
  callsAggregate(view, graph, traces, name, null, { ...spec, focus: param ? { card: 'agg:' + name + ':' + param } : null });
}

function serviceOverview(view, service, spec) {
  const name = service.service;
  const color = serviceColor(name);
  const aggs = service.aggregates;
  const consumed = [...new Set(aggs.flatMap(a => a.consumes.map(c => c.contract)))].sort();
  const published = [...new Set(aggs.flatMap(a => a.publishes.map(p => p.contract)))].sort();
  const endpoints = aggs.flatMap(a => a.endpoints);
  const schedules = aggs.flatMap(a => a.schedules);
  const links = [];
  const left = new Map();
  const right = new Map();
  const side = (map, key, make) => { if (!map.has(key)) map.set(key, make()); return map.get(key); };
  consumed.forEach(c => index.sourcesOf(c).filter(s => s !== name).forEach(source => {
    const card = side(left, source, () => serviceCard(source, 'from', []));
    card.rows.push({ id: c, label: c, lead: icon('event', 'E'), ports: { out: true }, alignLeft: true, href: to('contracts', c) });
    links.push({ from: [card.id, c], to: ['self', 'in:' + c], color: serviceColor(source), group: 'in:' + source, title: title(source) + ' → ' + c });
  }));
  published.forEach(c => index.targetsOf(c).filter(t => t !== name).forEach(target => {
    const card = side(right, target, () => serviceCard(target, 'to', []));
    card.rows.push({ id: c, label: c, lead: icon('event', 'E'), ports: { in: true }, alignLeft: true, href: to('contracts', c) });
    links.push({ from: ['self', 'out:' + c], to: [card.id, c], color, title: c + ' → ' + title(target) });
  }));
  const clients = endpoints.length ? [{ id: 'clients', glyph: 'external', title: 'HTTP Clients', tag: 'Callers', meta: 'Anyone Calling The API', dashed: true, color: 'var(--icon-gray)',
    rows: [{ id: 'http', label: amount(endpoints.length, 'Endpoint'), code: false, ports: { out: true }, note: count(endpoints, e => e.access === 'public' ? [e] : []) + ' Public' }] }] : [];
  clients.forEach(c => links.push({ from: [c.id, 'http'], to: ['self', 'api'], color: 'var(--icon-gray)', group: 'clients' }));
  const rows = [
    ...aggs.map(a => ({ id: 'agg:' + a.name, section: 'Aggregates', label: inline(icon('aggregate', 'A'), el('span', 'name', a.name)), code: false,
      note: amount(a.useCases.length, 'Use Case'), href: 'service/' + name + '/map/' + a.name, terms: [a.name] })),
    ...(endpoints.length ? [{ id: 'api', section: 'Exposes', label: amount(endpoints.length, 'Endpoint'), code: false, ports: { in: true }, note: [...new Set(endpoints.map(e => e.method))].join(', '), href: 'service/' + name + '/map' }] : []),
    ...schedules.map((t, i) => ({ id: 'sched' + i, section: 'Exposes', label: inline(icon('schedule', 'S'), el('span', null, 'Every ' + t.every)), code: false, note: t.useCase })),
    ...consumed.map(c => ({ id: 'in:' + c, section: 'Consumes', label: c, lead: icon('event', 'E'), ports: { in: true }, alignLeft: true, href: to('contracts', c) })),
    ...published.map(c => ({ id: 'out:' + c, section: 'Publishes', label: c, lead: icon('event', 'E'), ports: { out: true }, alignLeft: true, href: to('contracts', c) })),
    { id: 'store', section: 'Runs On', label: inline(glyph('database'), el('span', null, service.store || 'Store')), code: false, source: [{ service: name, type: repositoryImplementation(name) }] },
    ...Object.entries(service.adapters || {}).flatMap(([port, list]) => list.map(a => ({ id: 'adapter:' + a, section: 'Runs On', label: inline(glyph('adapter'), el('span', 'code', a)), code: false, note: port,
      source: [{ service: name, type: a }] })))
  ];
  const self = { id: 'self', glyph: 'service', title: title(name), tag: 'Service', badges: stackBadges(name), meta: serviceMeta(name), color, fixedRows: true, rows, service: name };
  stats([['Aggregate', aggs.length], ['Endpoint', endpoints.length], ['Consumed Event', consumed.length], ['Published Event', published.length]]);
  board(view, { ...spec, glyph: 'service', cardWidth: 300, gap: 200, columns: [
    { label: 'Receives From', cards: [...clients, ...left.values()] },
    { label: 'Service', cards: [self] },
    { label: 'Sends To', cards: [...right.values()] }
  ], links });
}

function criterionBadge(criterion) {
  const node = el('span', 'tag crit-badge');
  node.append(glyph('crit-' + criterion.toLowerCase()), document.createTextNode(criterion));
  return node;
}

function severityBadge(severity) {
  return el('span', 'sev-badge sev-' + severity.toLowerCase(), severity);
}

function stored(key, allowed) {
  try {
    const value = localStorage.getItem('blueprint:' + key);
    return allowed.includes(value) ? value : null;
  } catch (error) {
    return null;
  }
}

function store(key, value) {
  try { if (value) localStorage.setItem('blueprint:' + key, value); else localStorage.removeItem('blueprint:' + key); } catch (error) {}
}

const REVIEW_PLACES = [['Use Cases', 'U', 'usecase'], ['Domain Types', 'T', 'class'], ['Ports', 'P', 'port'], ['Adapters', 'C', 'class']];

function placeOf(service, type) {
  if (service.aggregates.some(a => a.useCases.some(u => u.name === type))) return 'Use Cases';
  if (Object.values(service.adapters || {}).flat().includes(type) || /Resource$/.test(type)) return 'Adapters';
  if ((service.dependencies || {})[type]) return 'Ports';
  return 'Domain Types';
}

function reviewPicker(scope) {
  const picker = el('nav', 'entry-picker');
  const pin = el('div', 'picker-pin');
  const all = el('button', 'picker-row picker-overview');
  all.type = 'button';
  all.append(glyph('review'), el('span', 'picker-text', 'All Findings'), el('span', 'picker-steps', String(FINDINGS.length)));
  if (!scope) all.setAttribute('aria-current', 'true');
  all.addEventListener('click', () => go('review'));
  pin.append(all);
  picker.append(pin);
  [...services].sort((a, b) => a.service.localeCompare(b.service)).forEach(s => {
    const group = el('details', 'picker-group');
    group.open = true;
    const head = el('summary', 'picker-service');
    head.append(el('span', 'picker-name', title(s.service)), el('span', 'picker-total', String(FINDINGS.filter(f => f.service === s.service).length)));
    group.append(head);
    const row = (label, lead, target, n, extra) => {
      const button = el('button', 'picker-row' + (extra || ''));
      button.type = 'button';
      button.append(lead, el('span', 'picker-text', label), el('span', 'picker-steps', String(n)));
      if (scope === target) button.setAttribute('aria-current', 'true');
      button.addEventListener('click', () => go('review/' + target));
      group.append(button);
    };
    const name = head.querySelector('.picker-name');
    name.classList.add('picker-link');
    if (scope === 'service:' + s.service) head.setAttribute('aria-current', 'true');
    name.addEventListener('click', event => { event.preventDefault(); go('review/service:' + s.service); });
    group.append(el('div', 'picker-kind picker-kind-top', 'Aggregates'));
    s.aggregates.forEach(a => {
      const verdict = (s.review || {})[a.name];
      row(a.name, icon('aggregate', 'A'), 'agg:' + s.service + ':' + a.name, FINDINGS.filter(f => f.service === s.service && f.unit === a.name).length,
        verdict && (verdict.stale || !verdict.reviewed) ? ' picker-stale' : '');
    });
    const own = FINDINGS.filter(f => f.service === s.service);
    const types = [...new Set(own.map(f => f.type.split('.')[0]))].filter(t => !s.aggregates.some(a => a.name === t));
    REVIEW_PLACES.forEach(([label, letter, kind]) => {
      const mine = types.filter(t => placeOf(s, t) === label).sort();
      if (!mine.length) return;
      group.append(el('div', 'picker-kind', label));
      mine.forEach(t => row(t, icon(kind, letter), 'type:' + s.service + ':' + t, own.filter(f => f.type.split('.')[0] === t).length));
    });
    picker.append(group);
  });
  picker.addEventListener('pointerdown', event => event.stopPropagation());
  return picker;
}

function storedSet(key, allowed) {
  try {
    return new Set((localStorage.getItem('blueprint:' + key) || '').split(',').filter(v => allowed.includes(v)));
  } catch (error) {
    return new Set();
  }
}

function storeSet(key, set) {
  try { if (set.size) localStorage.setItem('blueprint:' + key, [...set].join(',')); else localStorage.removeItem('blueprint:' + key); } catch (error) {}
}

function reviewPage(view, scope) {
  view.classList.add('split');
  view.append(reviewPicker(scope));
  const [kind, service, target] = scope ? scope.split(':') : [];
  const scoped = FINDINGS.filter(f => !service || (f.service === service && (kind !== 'agg' || f.unit === target) && (kind !== 'type' || f.type.split('.')[0] === target)));
  const severities = storedSet('severities', SEVERITIES);
  const criteria = storedSet('criteria', REVIEW_KINDS);
  const page = el('section', 'review-split');
  const pane = el('div', 'review-pane');
  const toolbar = el('div', 'review-toolbar sheet-bar');
  const rows = el('div', 'review-rows');
  const detail = el('div', 'review-detail');
  pane.append(toolbar, rows);
  page.append(pane, detail);
  view.append(page);
  let selected = null;
  let query = '';
  let openMenu = null;
  const menu = (label, values, chosen, key, field, lead) => {
    const wrap = el('div', 'filter-menu');
    const button = el('button', 'filter-button' + (chosen.size ? ' active' : ''));
    button.type = 'button';
    const summary = !chosen.size ? 'All' : chosen.size === 1 ? [...chosen][0] : chosen.size + ' Selected';
    button.append(el('span', 'filter-button-label', label), el('span', 'filter-button-value', summary), el('span', 'filter-caret'));
    wrap.append(button);
    if (openMenu === label) {
      const list = el('div', 'filter-popup');
      values.forEach(value => {
        const n = scoped.filter(f => f[field] === value).length;
        const item = el('button', 'filter-option' + (n ? '' : ' empty'));
        item.type = 'button';
        item.setAttribute('aria-checked', chosen.has(value) ? 'true' : 'false');
        item.append(el('span', 'filter-check'), lead(value), el('span', 'filter-name', value), el('span', 'filter-count', String(n)));
        item.addEventListener('click', event => {
          event.stopPropagation();
          if (chosen.has(value)) chosen.delete(value); else chosen.add(value);
          storeSet(key, chosen);
          render();
        });
        list.append(item);
      });
      if (chosen.size) {
        const clear = el('button', 'filter-option filter-reset', 'Show All');
        clear.type = 'button';
        clear.addEventListener('click', event => { event.stopPropagation(); chosen.clear(); storeSet(key, chosen); render(); });
        list.append(clear);
      }
      wrap.append(list);
    }
    button.addEventListener('click', event => {
      event.stopPropagation();
      openMenu = openMenu === label ? null : label;
      render();
    });
    return wrap;
  };
  const closeMenus = event => {
    if (!document.body.contains(page)) { document.removeEventListener('click', closeMenus); return; }
    if (openMenu && !event.target.closest('.filter-menu')) { openMenu = null; render(); }
  };
  document.addEventListener('click', closeMenus);
  const visible = () => scoped.filter(f => (!severities.size || severities.has(f.severity)) && (!criteria.size || criteria.has(f.criterion))
    && (!query || [f.title, f.type, f.member, f.why, f.suggestion, f.criterion].join(' ').toLowerCase().includes(query)));
  const show = f => {
    selected = f;
    rows.querySelectorAll('.review-row').forEach(r => r.classList.toggle('selected', r.finding === f));
    detail.replaceChildren(f ? findingDetail(f) : el('div', 'muted inspector-empty', 'No Findings'));
  };
  const render = () => {
    const search = toolbar.querySelector('.search');
    toolbar.replaceChildren(
      menu('Severity', SEVERITIES, severities, 'severities', 'severity', v => el('span', 'sev-dot sev-' + v.toLowerCase())),
      menu('Criterion', REVIEW_KINDS, criteria, 'criteria', 'criterion', v => glyph('crit-' + v.toLowerCase())));
    if (search) toolbar.prepend(search);
    const shown = visible();
    stats([['Finding', shown.length], ...SEVERITIES.map(sev => [sev, shown.filter(f => f.severity === sev).length])]);
    rows.replaceChildren();
    const groups = new Map();
    shown.forEach(f => {
      const key = f.service + '|' + f.unit;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(f);
    });
    [...groups.entries()].sort((x, y) => x[0].localeCompare(y[0])).forEach(([key, list]) => {
      const [svcName, unit] = key.split('|');
      const head = el('div', 'review-rows-head');
      const dot = el('span', 'service-dot');
      dot.style.background = serviceColor(svcName);
      head.append(dot, el('span', 'muted', title(svcName)), el('span', 'sep', '›'), el('span', null, unit), el('span', 'count', String(list.length)));
      const verdict = ((services.find(x => x.service === svcName) || {}).review || {})[unit];
      if (verdict && verdict.stale) head.insertBefore(tag('Outdated'), head.lastChild);
      rows.append(head);
      list.forEach(f => {
        const row = el('button', 'review-row');
        row.type = 'button';
        row.finding = f;
        const where = f.type + (f.member ? '.' + f.member : '');
        row.append(severityBadge(f.severity), el('span', 'review-row-title', f.criterion === 'Complexity' ? 'Cognitive Complexity ' + f.score : f.title), criterionBadge(f.criterion));
        row.title = f.title + ', ' + where;
        row.addEventListener('click', () => show(f));
        rows.append(row);
      });
    });
    if (!shown.length) rows.append(el('div', 'muted inspector-empty', 'No Findings'));
    const first = rows.querySelector('.review-row');
    show(shown.includes(selected) ? selected : first ? first.finding : null);
  };
  boardFilter = q => { query = q; render(); };
  keys = event => {
    if (event.target.tagName === 'INPUT' || !['ArrowDown', 'ArrowUp', 'j', 'k'].includes(event.key)) return;
    const list = [...rows.querySelectorAll('.review-row')];
    const i = list.findIndex(r => r.finding === selected);
    const next = list[Math.max(0, Math.min(list.length - 1, i + (event.key === 'ArrowDown' || event.key === 'j' ? 1 : -1)))];
    if (next) { event.preventDefault(); show(next.finding); next.scrollIntoView({ block: 'nearest' }); }
  };
  render();
}

function findingDetail(f) {
  const box = el('article', 'finding-detail');
  const head = el('div', 'detail-head');
  head.append(el('h2', 'detail-title', f.criterion === 'Complexity' ? 'Cognitive Complexity' : f.title));
  box.append(head);
  const tags = el('div', 'detail-tags');
  tags.append(severityBadge(f.severity), criterionBadge(f.criterion));
  if (f.stale) tags.append(tag('Outdated'));
  box.append(tags);
  const where = el('div', 'detail-where');
  const at = el('span', 'code', f.type + (f.member ? '.' + f.member + (f.criterion === 'Complexity' ? '()' : '') : ''));
  if (f.line) at.append(el('span', 'muted', ':' + f.line));
  where.append(el('span', 'muted', title(f.service) + ' › ' + f.unit + ' ›'), at);
  box.append(where);
  const actions = el('div', 'detail-actions');
  if (f.file) {
    const open = el('a', 'inspector-open detail-primary', 'Open In IntelliJ');
    open.href = ideLink(f.file, f.line);
    actions.append(open);
  }
  if (f.unit && f.unit !== 'Other') {
    const map = el('a', 'detail-secondary', 'Show In Map');
    map.href = '#/service/' + f.service + '/map/' + f.unit;
    actions.append(map);
  }
  box.append(actions);
  if (f.criterion === 'Complexity') {
    box.append(el('div', 'inspector-label', 'Score'));
    const meter = el('div', 'complexity-meter');
    const fill = el('span', 'complexity-fill sev-' + f.severity.toLowerCase());
    fill.style.width = Math.min(100, f.score / (f.limit * 2) * 100) + '%';
    meter.append(fill, el('span', 'complexity-limit'));
    const row = el('div', 'complexity-row');
    row.append(meter, el('span', 'complexity-score', f.score + ' / ' + f.limit));
    box.append(row);
  } else {
    box.append(el('div', 'inspector-label', 'Why'), el('p', 'detail-text', f.why));
    const fix = el('p', 'detail-text detail-fix');
    fix.append(el('span', 'fix-arrow', '→'), el('span', null, f.suggestion));
    box.append(el('div', 'inspector-label', 'Suggestion'), fix);
  }
  const snippet = codeSnippet({ service: f.service, type: f.type.split('.')[0], member: f.type.includes('.') ? undefined : f.member || undefined, line: f.line || undefined });
  if (snippet) box.append(el('div', 'inspector-label', 'Code'), snippetBox(snippet));
  return box;
}

function blueprintPage(view, service, spec) {
  const page = el('section', 'code-canvas');
  const bar = el('div', 'sheet-bar');
  bar.append(canvasBadge(spec.glyph, spec.label, spec.tabs));
  page.append(bar);
  view.append(page);
  const aggs = service.aggregates;
  stats([['Aggregate', aggs.length], ['Endpoint', count(aggs, a => a.endpoints)], ['Consumed Event', count(aggs, a => a.consumes)], ['Published Event', count(aggs, a => a.publishes)]]);
  if (!service.blueprint) {
    page.append(el('div', 'muted inspector-empty', 'No Source Found'));
    return;
  }
  const sheet = el('div', 'blueprint-sheet');
  const top = el('div', 'sheet-head');
  const open = el('a', 'blueprint-open');
  open.href = ideLink(service.blueprint.file);
  open.title = 'Open In IntelliJ';
  open.append(el('span', 'code', service.blueprint.file.split('/').pop()), el('span', 'inspector-arrow', '↗'));
  top.append(glyph('contracts'), el('span', 'title', title(service.service) + 'Blueprint'), open);
  sheet.append(top);
  const code = el('div', 'sheet-code');
  const lines = service.blueprint.text.replace(/\n+$/, '').split(NL);
  const line = (text, i) => {
    const row = el('a', 'blueprint-line');
    row.href = ideLink(service.blueprint.file, i + 1);
    row.title = 'Open In IntelliJ';
    row.dataset.text = text.toLowerCase();
    const body = el('span', 'code-lines');
    body.style.setProperty('--indent', (text.match(/^ */)[0].length / 2) + 'ch');
    body.append(highlightJava(text.trim() || ' '));
    row.append(el('span', 'line-no', String(i + 1)), body);
    return row;
  };
  for (let i = 0; i < lines.length; i++) {
    if (/^import /.test(lines[i])) {
      let j = i;
      while (j + 1 < lines.length && /^import /.test(lines[j + 1])) j++;
      const fold = el('details', 'import-fold');
      const summary = el('summary', 'blueprint-line');
      const body = el('span', 'code-lines');
      body.append(highlightJava('import …'), el('span', 'fold-count', amount(j - i + 1, 'Import')));
      summary.append(el('span', 'line-no', String(i + 1)), body);
      fold.append(summary);
      for (let k = i; k <= j; k++) fold.append(line(lines[k], k));
      code.append(fold);
      i = j;
      continue;
    }
    code.append(line(lines[i], i));
  }
  sheet.append(code);
  const scroller = el('div', 'sheet-scroll');
  scroller.append(sheet);
  page.append(scroller);
  boardFilter = query => code.querySelectorAll('a.blueprint-line').forEach(r => r.classList.toggle('dim', query !== '' && !r.dataset.text.includes(query)));
}

function packageOf(type) {
  return type.substring(0, type.lastIndexOf('.'));
}

function filter(event) {
  const query = event.target.value.trim().toLowerCase();
  if (boardFilter) {
    boardFilter(query);
    return;
  }
  const view = document.getElementById('view');
  const match = node => query === '' || node.textContent.toLowerCase().includes(query);
  view.querySelectorAll('.routes .route:not(.head), .publishes .row:not(.head), .moment').forEach(row => row.classList.toggle('hidden', !match(row)));
}

document.getElementById('search').addEventListener('input', filter);

function themeButton() {
  const button = document.getElementById('theme');
  const dark = document.documentElement.dataset.theme !== 'light';
  const icon = svg('svg', { viewBox: '0 0 16 16', 'aria-hidden': 'true' });
  if (dark) {
    icon.append(svg('circle', { cx: 8, cy: 8, r: 3, stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none' }),
      svg('path', { d: 'M8 1 V2.6 M8 13.4 V15 M1 8 H2.6 M13.4 8 H15 M3 3 L4.1 4.1 M11.9 11.9 L13 13 M3 13 L4.1 11.9 M11.9 4.1 L13 3', stroke: 'currentColor', 'stroke-width': 1.4, 'stroke-linecap': 'round' }));
  } else {
    icon.append(svg('path', { d: 'M13.5 9.6 A5.8 5.8 0 1 1 6.4 2.5 A4.6 4.6 0 0 0 13.5 9.6 Z', stroke: 'currentColor', 'stroke-width': 1.4, fill: 'none', 'stroke-linejoin': 'round' }));
  }
  button.replaceChildren(icon);
  button.title = dark ? 'Light Theme' : 'Dark Theme';
  button.setAttribute('aria-label', button.title);
}

document.getElementById('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('blueprint:theme', next); } catch (error) {}
  themeButton();
  redraw();
});
themeButton();
resizer(document.querySelector('.layout'), 'side-w', 'left', 180, 420);
window.addEventListener('hashchange', show);
window.addEventListener('keydown', event => keys(event));
window.addEventListener('resize', () => { redraw(); refocus(); });
if (document.fonts) document.fonts.ready.then(() => { redraw(); refocus(); });
show();
</script>
</body>
